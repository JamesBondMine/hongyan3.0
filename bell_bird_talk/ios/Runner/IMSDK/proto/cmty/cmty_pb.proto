syntax = "proto3";

package im.cmty;

import "system_pb.proto";
import "cmty/cmty_member_pb.proto";
import "cmty/cmty_permission_pb.proto";
import "cmty/cmty_settings_pb.proto";

option java_package = "com.cloud.im.common.core.protocol.cmty";
option java_outer_classname = "CmtyProtos";

// ========== 枚举类型定义 ==========

// 社群状态枚举
enum CmtyStatus {
    ACTIVE = 0;     // 正常（默认值）
    DISABLED = 1;   // 禁用
    SUSPENDED = 2;  // 暂停
}

// 成员状态枚举
enum CmtyMemberStatus {
    NORMAL = 0;     // 正常（默认值）
    MUTED = 1;      // 禁言
    BANNED = 2;     // 封禁
    KICKED = 3;     // 踢出
}

// ========== 查询操作 ==========

// CmtyListQuery - 列表查询（用于list和discover方法）
message CmtyListQuery {
    com.cloud.im.common.core.system.Page page = 1;  // 分页参数（可选，使用系统类型）
    string keyword = 2;  // 搜索关键词（可选，discover方法使用）
}

// ========== 领域对象 ==========

// Cmty - 社群信息（Community的简写，保持与代码一致）
message Cmty {
    string community_id = 1;        // 社群ID（返回字段）
    string community_name = 2;      // 社群名称（返回字段）
    string community_avatar = 3;    // 社群头像URL（返回字段）
    string description = 4;         // 社群描述（返回字段）
    string owner_id = 5;            // 超管ID（返回字段）
    int32 member_count = 6;         // 成员数量（返回字段）
    CmtyStatus status = 7;          // 社群状态（返回字段）
    int64 created_at = 11;          // 创建时间（返回字段）
    int64 updated_at = 12;          // 更新时间（返回字段）
    string extra_info = 13;         // 扩展信息(JSON)（返回字段）
    bool is_member = 14;            // 查询者是否为成员（返回字段，info和discover方法使用）
}

// ========== 结果对象 ==========

// CmtyList - 社群列表
message CmtyList {
    repeated Cmty communities = 1;  // 社群列表
    com.cloud.im.common.core.system.Page page = 2;  // 分页元数据（使用系统类型）
}

// CmtyDetailResult - 社群详细信息结果（用于detail方法）
message CmtyDetailResult {
    Cmty community = 1;                    // 社群信息（返回字段）
    im.cmty.member.CmtyMember member = 2;  // 成员信息（返回字段，包含角色列表）
    im.cmty.PermissionTemplate permission_template = 3;  // 基于当前角色的权限模板（返回字段）
}

// ========== 操作对象 ==========

// CmtyJoin - 加入社群
// 注意：communityId 从 Topic 路径中获取（/im/CMTY/{communityId}/join）
message CmtyJoin {
    string invite_code = 1;   // 邀请码（可选）
    string invite_link = 2;   // 邀请链接（可选）
    string inviter_user_id = 3;  // 邀请人用户ID（可选）
}

// CmtyUpdateMemberCount - 更新社群成员总数
// 注意：communityId 从 Topic 路径中获取（/im/CMTY/{communityId}/updateMemberCount）
message CmtyUpdateMemberCount {
    int32 member_count = 1;  // 成员总数（必填）
}

// CmtySearchQuery - 搜索查询
message CmtySearchQuery {
    string keyword = 1;  // 搜索关键词（必填）
    com.cloud.im.common.core.system.Page page = 2;  // 分页参数（可选，使用系统类型）
}

// CmtyQuery - 查询列表-管理端
message CmtyQuery {
    optional string community_name = 1;      // 社群名称（可选）
    optional CmtyStatus status = 2;          // 社群状态（可选）
    optional string owner_name = 3;          // 超管账号（可选）
    optional string start_time = 4;          // 时间范围（可选）
    optional string end_time = 5;          // 时间范围（可选）
    optional string app_id = 6;  // 标识（可选）
    com.cloud.im.common.core.system.Page page = 7;  // 分页参数（可选，使用系统类型）
}

// CmtyOnlineCount - 在线人数
message CmtyOnlineCount {
    string cmty_id = 1;  // 社群ID（返回字段）
    int32 online_count = 2;  // 在线人数（返回字段）
    int64 updated_at = 3;    // 更新时间（返回字段）
}

// 注意：CmtyBannedMembersQuery 已移至 cmty_security_pb.proto

// CmtyLeaveRestriction - 离开限制
message CmtyLeaveRestriction {
    bool can_leave = 1;           // 是否可以离开（返回字段）
    int32 cooldown_hours = 2;     // 冷却期（小时，返回字段）
    int64 next_leave_at = 3;      // 下次可离开时间（返回字段）
    string reason = 4;            // 原因（如果不可离开，返回字段）
}

// CmtyRejoinRestriction - 重新进入限制
message CmtyRejoinRestriction {
    bool can_rejoin = 1;          // 是否可以重新进入（返回字段）
    int32 wait_hours = 2;         // 等待期（小时，返回字段）
    int64 next_rejoin_at = 3;    // 下次可重新进入时间（返回字段）
    string reason = 4;           // 原因（如果不可重新进入，返回字段）
}
