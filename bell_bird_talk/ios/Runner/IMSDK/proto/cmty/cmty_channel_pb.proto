syntax = "proto3";

package im.cmty.channel;

option java_package = "com.cloud.im.common.core.protocol.cmty.channel";
option java_outer_classname = "CmtyChannelProtos";

// ========== 枚举类型定义 ==========

// 频道类型枚举
enum ChannelType {
    TEXT = 0;       // 文字频道（默认值）
    VOICE = 1;      // 语音频道
}

// 通知类型枚举
enum NotificationType {
    ALL = 0;            // 所有通知（默认值）
    MENTION_ONLY = 1;   // 仅@我的
    MUTE = 2;          // 不通知
}

// ========== 查询操作 ==========

// CmtyChannelsQuery - 频道查询（用于channels方法）
message CmtyChannelsQuery {
    string community_id = 1;  // 社群ID（必填）
    string category_id = 2;    // 分类ID（可选，不填则查询所有分类）
}

// ========== 领域对象 ==========

// CmtyChannel - 频道信息
message CmtyChannel {
    string channel_id = 1;        // 频道ID（群组ID，返回字段）
    string community_id = 2;      // 社群ID（返回字段）
    string category_id = 3;       // 分类ID（返回字段）
    string channel_name = 4;      // 频道名称（返回字段）
    ChannelType channel_type = 5;  // 频道类型（返回字段）
    string description = 6;        // 频道描述（返回字段）
    int32 member_count = 7;       // 成员数量（返回字段）
    int32 max_members = 8;        // 最大成员数（语音频道，返回字段）
    bool pause_invite = 9;        // 是否暂停邀请（返回字段）
    bool mute_all = 10;           // 是否禁止发言（返回字段）
    NotificationType notification_type = 11; // 通知类型（返回字段）
    int64 created_at = 12;        // 创建时间（返回字段）
    int64 updated_at = 13;         // 更新时间（返回字段）
}

// ========== 结果对象 ==========

// CmtyChannelList - 频道列表
message CmtyChannelList {
    repeated CmtyChannel channels = 1;  // 频道列表
}

// CmtyChannelSettings - 频道设置
message CmtyChannelSettings {
    string channel_id = 1;        // 频道ID（返回字段）
    bool pause_invite = 2;        // 是否暂停邀请（返回字段）
    bool mute_all = 3;            // 是否禁止发言（返回字段）
    NotificationType notification_type = 4;   // 通知类型（返回字段）
}

// ========== 操作对象 ==========

// CmtyCreateChannel - 创建频道
message CmtyCreateChannel {
    string community_id = 1;  // 社群ID（必填）
    string category_id = 2;   // 分类ID（必填）
    string channel_name = 3;  // 频道名称（必填，2-50字符）
    ChannelType channel_type = 4;   // 频道类型（必填）
    string description = 5;   // 频道描述（可选）
    int32 max_members = 6;    // 最大成员数（可选，语音频道默认50）
}

// CmtyUpdateChannel - 更新频道
message CmtyUpdateChannel {
    string channel_id = 1;        // 频道ID（必填）
    string channel_name = 2;      // 频道名称（可选，2-50字符）
    bool pause_invite = 3;        // 是否暂停邀请（可选）
    bool mute_all = 4;           // 是否禁止发言（可选）
    NotificationType notification_type = 5;   // 通知类型（可选）
}

// CmtyDeleteChannel - 删除频道
message CmtyDeleteChannel {
    string channel_id = 1;  // 频道ID（必填）
}

