syntax = "proto3";

package im.cmty.category;

option java_package = "com.cloud.im.common.core.protocol.cmty.category";
option java_outer_classname = "CmtyCategoryProtos";

// ========== 领域对象 ==========

// CmtyCategory - 分类信息
message CmtyCategory {
    string category_id = 1;    // 分类ID
    string community_id = 2;   // 社群ID
    string category_name = 3;  // 分类名称
    int32 sort_order = 4;      // 排序
    int64 created_at = 5;     // 创建时间
    int64 updated_at = 6;      // 更新时间
}

// ========== 结果对象 ==========

// CmtyCategoryList - 分类列表
message CmtyCategoryList {
    repeated CmtyCategory categories = 1;  // 分类列表
}

// ========== 操作对象 ==========

// CmtyCreateCategory - 创建分类
message CmtyCreateCategory {
    string community_id = 1;  // 社群ID（必填）
    string category_name = 2; // 分类名称（必填，2-50字符）
}

// CmtyUpdateCategory - 更新分类
message CmtyUpdateCategory {
    string category_id = 1;   // 分类ID（必填）
    string category_name = 2; // 分类名称（必填，2-50字符）
}

// CmtyDeleteCategory - 删除分类
message CmtyDeleteCategory {
    string category_id = 1;  // 分类ID（必填）
}

// CmtyReorderCategories - 重新排序分类
message CmtyReorderCategories {
    string community_id = 1;           // 社群ID（必填）
    repeated string category_ids = 2; // 分类ID列表（按新顺序排列）
}

