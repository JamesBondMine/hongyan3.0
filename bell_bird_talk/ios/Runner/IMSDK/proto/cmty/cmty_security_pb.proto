syntax = "proto3";

package im.cmty.security;

import "system_pb.proto";

option java_package = "com.cloud.im.common.core.protocol.cmty.security";
option java_outer_classname = "CmtySecurityProtos";

// ========== 操作对象 ==========

// CmtyMuteMember - 禁言成员
// 注意：communityId 从 Topic 路径中获取（/im/CMTY/{communityId}/mute）
message CmtyMuteMember {
    string user_id = 1;  // 用户ID（必填）
    bool mute = 2;       // 是否禁言（true=禁言，false=解除禁言）
    int64 mute_until = 3; // 禁言到期时间戳（可选，0或未设置表示永久禁言，>0表示临时禁言）
}

// CmtyBanMember - 封禁成员
// 注意：communityId 从 Topic 路径中获取（/im/CMTY/{communityId}/ban）
message CmtyBanMember {
    string user_id = 1;  // 用户ID（必填）
    bool ban = 2;        // 是否封禁（true=封禁，false=解除封禁）
    int64 ban_until = 3; // 封禁到期时间戳（可选，0或未设置表示永久封禁，>0表示临时封禁）
}

// CmtyBannedMembersQuery - 封禁成员查询
// 注意：cmtyId 从 Topic 路径中获取
message CmtyBannedMembersQuery {
    com.cloud.im.common.core.system.Page page = 1;  // 分页参数（可选，使用系统类型）
}

// CmtyAppealBan - 申诉封禁
// 注意：cmtyId 从 Topic 路径中获取，userId 从 fromId 获取
message CmtyAppealBan {
    string reason = 1;        // 申诉原因（必填）
    string evidence = 2;       // 申诉证据（可选，如截图链接）
}

// CmtyAppealResult - 申诉结果
message CmtyAppealResult {
    bool accepted = 1;        // 是否接受申诉（返回字段）
    string message = 2;        // 处理结果消息（返回字段）
    int64 process_at = 3;     // 处理时间（返回字段）
}

