syntax = "proto3";
package im.setting;

option java_package = "com.cloud.im.common.core.protocol.setting";
option java_outer_classname = "SettingProtos";

import "google/protobuf/wrappers.proto";

// ============ 核心领域对象 ============

// 用户设置 - 核心领域对象
// 用于用户设置的存储和传输
message Setting {
  string user_id = 1;              // 用户ID（必填）
  bool is_voice_notice = 2;        // 是否语音通知（必填，默认true）
  bool is_shake_notice = 3;        // 是否震动通知（必填，默认true）
  bool is_new_msg_notify = 4;      // 是否新消息提醒（必填，默认true）
  bool read_receipt_enabled = 5;   // 是否开启已读回执（必填，默认true，参考Signal的隐私控制）
  string ext_settings = 6;         // 扩展设置（可选，JSON格式字符串）
  int64 create_time = 7;           // 创建时间（可选，Unix时间戳，单位：毫秒）
  int64 update_time = 8;           // 更新时间（可选，Unix时间戳，单位：毫秒）
  int32 version = 9;               // 版本号（可选，乐观锁）
}

// ============ 查询操作 ============

// 获取用户设置 - 查询操作
// 用于查询用户的设置信息
message GetSettings {
  // 空消息，使用userId从上下文获取
  // 如果需要查询其他用户的设置（管理员功能），可以添加 user_id 字段
}

// ============ 操作对象 ============

// 更新用户设置 - 操作对象
// 用于更新用户的设置信息
// 使用包装类型（google.protobuf.BoolValue）来区分"未设置"和"设置为false"
message SUpdateSettings {
  google.protobuf.BoolValue is_voice_notice = 1;   // 是否语音通知（可选，使用包装类型）
  google.protobuf.BoolValue is_shake_notice = 2;   // 是否震动通知（可选，使用包装类型）
  google.protobuf.BoolValue is_new_msg_notify = 3; // 是否新消息提醒（可选，使用包装类型）
  google.protobuf.BoolValue read_receipt_enabled = 4; // 是否开启已读回执（可选，使用包装类型）
  google.protobuf.StringValue ext_settings = 5;    // 扩展设置（可选，JSON格式字符串，使用包装类型）
}

// 切换语言 - 操作对象
// 用于切换用户的语言偏好
message ChangeLocale {
  string locale = 1;  // 语言标签（必填），如 "zh-CN", "en-US", "zh-TW"
}

// 语言信息 - 结果对象
// 用于返回语言相关信息
message LocaleInfo {
  string code = 1;                    // 语言代码（必填），如 "zh_CN"
  string language_tag = 2;            // 语言标签（必填），如 "zh-CN"
  string display_name = 3;            // 显示名称（必填），如 "简体中文"
  string native_display_name = 4;     // 本地化显示名称（必填），如 "简体中文"
  bool is_default = 5;                // 是否为默认语言（必填）
}

// 支持的语言列表 - 结果对象
// 用于返回服务端支持的所有语言列表
message SupportedLocales {
  repeated LocaleInfo locales = 1;    // 支持的语言列表（必填）
  string default_locale = 2;          // 默认语言代码（必填），如 "zh_CN"
}

// ============ 响应说明 ============
// 查询成功响应：返回 Setting 对象
// 更新成功响应：返回 Setting 对象（更新后的设置）
// 切换语言成功响应：返回 Setting 对象（更新后的设置，包含新的语言偏好）
// 错误响应：使用 com.cloud.im.common.core.system.Error

