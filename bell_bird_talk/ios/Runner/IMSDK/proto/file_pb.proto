syntax = "proto3";

package im.file;

option java_package = "com.cloud.im.common.core.protocol.file";
option java_outer_classname = "FileProtos";

// ========== 枚举定义 ==========
//要存储的业务方向，和系统的业务模块没啥关系。主要是要明确相关的文件存储的规则
enum BusinessModule{
  AVATAR = 0;              // 用户头像
  GROUP_AVATAR = 1;        // 群头像
  GROUP_IMG = 2;           // 群图片
  GROUP_VIDEO = 3;         // 群视频
  GROUP_AUDIO = 4;         // 群音频
  GROUP_FILE = 5;          // 群文件
  CHAT_IMG = 6;            // 聊天图片
  CHAT_VIDEO = 7;          // 聊天视频
  CHAT_AUDIO = 8;          // 聊天音频
  CHAT_FILE = 9;           // 聊天文件
  MESSAGE = 10;            // 消息附件（通用）
}

// OSS提供商类型
enum OssProviderType {
  ALIYUN = 0;              // 阿里云OSS
  TENCENT = 1;             // 腾讯云COS
  AWS = 2;                 // AWS S3
  MINIO = 3;               // MinIO
  HUAWEI = 4;              // 华为云OBS
}

// HTTP方法
enum HttpMethod {
  GET = 0;
  POST = 1;
  PUT = 2;
  DELETE = 3;
  PATCH = 4;
}

// 上传模式
enum UploadMode {
  POST_OBJECT = 0;         // 表单上传（兼容模式）
  STS_SDK = 1;            // STS临时凭证通过SDK上传（推荐模式）
  PRESIGNED_URL = 2;      // Presigned URL上传
}

// 字段类型
enum FieldType {
  STRING = 0;              // 字符串类型
  INTEGER = 1;             // 整数类型
  BOOLEAN = 2;             // 布尔类型
  PASSWORD = 3;            // 密码类型（敏感字段）
  TEXT = 4;                // 文本类型（多行）
}

// ============ 查询操作 ============

// 获取渠道列表 - 查询操作
message GetFChannels {
  bool include_fields = 1;  // 是否包含字段定义（可选，默认false）
}

// 准备上传 - 操作对象
message Prepare {
  BusinessModule business_module = 1;  // 业务模块（必填）
  string file_name = 2;                 // 文件名（必填）
  int64 file_size = 3;                  // 文件大小（可选，字节）
  string content_type = 4;              // 文件MIME类型（可选）
}

// 切换渠道 - 操作对象
message SwitchFChannel {
  OssProviderType channel_type = 1;  // 渠道类型（必填）
  string oss_config = 2;             // OSS配置JSON（必填，根据渠道fields定义）
}

// ============ 结果对象 ============

// 上传凭证
message Token {
  OssProviderType provider_code = 1;   // 提供商类型
  string upload_url = 2;               // 上传URL
  HttpMethod method = 3;                // HTTP方法
  map<string, string> headers = 4;      // HTTP头
  map<string, string> form_data = 5;   // 表单字段
  string file_path = 6;                // 文件路径
  string file_url = 7;                 // 文件访问URL
  int64 expires_at = 8;                // 过期时间戳（Unix时间戳，秒）
  int32 expires_in = 9;                // 有效期（秒）
  
  // STS临时凭证相关字段（当upload_mode=STS_SDK时使用）
  UploadMode upload_mode = 10;         // 上传模式
  string sts_access_key_id = 11;       // STS临时访问密钥ID
  string sts_access_key_secret = 12;   // STS临时访问密钥Secret
  string sts_security_token = 13;      // STS安全令牌（Session Token）
  string sts_expiration = 14;          // STS过期时间（ISO 8601格式）
  string bucket_name = 15;             // 存储桶名称
  string region = 16;                  // 区域ID
}

// 渠道列表
message FChannelList {
  repeated FChannel channels = 1;           // 渠道列表
  OssProviderType default_channel_type = 2;  // 默认渠道类型
}

// 渠道信息
message FChannel {
  OssProviderType channel_type = 1;   // 渠道类型
  string channel_name = 2;            // 渠道显示名称
  string channel_description = 3;     // 渠道描述
  string service_class_name = 4;      // 服务实现类名
  repeated FChannelField fields = 5;   // 配置字段定义列表（可选）
  string default_config_json = 6;     // 默认配置JSON字符串（可选）
  bool is_system = 7;                 // 是否系统内置渠道
  int32 display_order = 8;            // 显示顺序
  string icon_url = 9;                // 图标URL（可选）
  string documentation_url = 10;     // 文档链接（可选）
}

// 渠道字段定义
message FChannelField {
  string field_name = 1;             // 字段名
  string field_label = 2;            // 字段显示标签
  FieldType field_type = 3;          // 字段类型
  string field_description = 4;      // 字段描述
  bool is_required = 5;              // 是否必填
  bool is_sensitive = 6;            // 是否敏感字段
  string default_value = 7;          // 默认值（可选）
  string placeholder = 8;            // 输入框占位符
  string help_text = 9;             // 帮助文本
  int32 display_order = 10;          // 显示顺序
  Validation validation = 11;        // 验证规则对象（可选）
}

// 字段验证规则
message Validation {
  string regex = 1;                 // 验证正则表达式
  int32 min_length = 2;             // 最小长度
  int32 max_length = 3;             // 最大长度
  double min_value = 4;             // 最小值（数值类型）
  double max_value = 5;             // 最大值（数值类型）
  bool is_valid = 6;                // 验证是否通过（用于返回验证结果）
  string error_message = 7;         // 错误消息（用于返回验证结果）
}

