syntax = "proto3";

package im.community;

option java_package = "com.cloud.im.common.core.protocol.community";
option java_outer_classname = "CommunityProtos";

// ========== 查询操作 ==========

// ListQuery - 列表查询（用于list、members、channels方法）
message ListQuery {
    int32 page = 1;      // 页码（可选，默认1）
    int32 size = 2;      // 每页数量（可选，默认20）
    string keyword = 3;  // 搜索关键词（可选）
}

// MembersQuery - 成员查询（用于members方法）
message MembersQuery {
    string community_id = 1;  // 社群ID（必填）
    int32 offset = 2;         // 偏移量（可选）
    int32 limit = 3;          // 数量限制（可选）
}

// CommChannelsQuery - 频道查询（用于channels方法）
message CommChannelsQuery {
    string community_id = 1;  // 社群ID（必填）
    string category_id = 2;    // 分类ID（可选，不填则查询所有分类）
}

// ========== 领域对象 ==========

// Community - 社群信息
message Community {
    string community_id = 1;        // 社群ID
    string community_name = 2;      // 社群名称
    string community_avatar = 3;    // 社群头像URL
    string description = 4;         // 社群描述
    string owner_id = 5;            // 超管ID
    int32 member_count = 6;         // 成员数量
    int32 status = 7;               // 社群状态
    bool need_verify = 8;           // 是否需要审核
    bool allow_private_chat = 9;    // 是否允许单聊
    bool allow_add_friend = 10;     // 是否允许添加好友
    int64 created_at = 11;          // 创建时间
    int64 updated_at = 12;          // 更新时间
    string extra_info = 13;         // 扩展信息(JSON)
}

// Category - 分类信息
message Category {
    string category_id = 1;    // 分类ID
    string community_id = 2;   // 社群ID
    string category_name = 3;  // 分类名称
    int32 sort_order = 4;       // 排序
    int64 created_at = 5;      // 创建时间
    int64 updated_at = 6;      // 更新时间
}

// CommChannel - 频道信息
message CommChannel {
    string channel_id = 1;        // 频道ID（群组ID）
    string community_id = 2;      // 社群ID
    string category_id = 3;       // 分类ID
    string channel_name = 4;      // 频道名称
    int32 channel_type = 5;      // 频道类型（1=文字频道，2=语音频道）
    string description = 6;       // 频道描述
    int32 member_count = 7;       // 成员数量
    int32 max_members = 8;        // 最大成员数（语音频道）
    bool pause_invite = 9;       // 是否暂停邀请
    bool mute_all = 10;          // 是否禁止发言
    int32 notification_type = 11; // 通知类型（1=所有通知，2=仅@我的，3=不通知）
    int64 created_at = 12;       // 创建时间
    int64 updated_at = 13;       // 更新时间
}

// Member - 成员信息
message Member {
    string user_id = 1;         // 用户ID
    string nickname = 2;        // 昵称
    string username = 3;        // 用户名
    string avatar = 4;          // 头像URL
    int32 role = 5;            // 角色（超管、普通成员）
    int64 joined_at = 6;       // 加入时间
    string join_way = 7;       // 加入方式（自主加入、邀请加入）
    int32 invite_count = 8;    // 邀请人数
}

// ========== 结果对象 ==========

// CommunityList - 社群列表
message CommunityList {
    repeated Community communities = 1;  // 社群列表
    int32 total = 2;                    // 总数量
    int32 page = 3;                     // 当前页码
    int32 size = 4;                     // 每页数量
}

// CategoryList - 分类列表
message CategoryList {
    repeated Category categories = 1;  // 分类列表
}

// CommChannelList - 频道列表
message CommChannelList {
    repeated CommChannel channels = 1;  // 频道列表
}

// MemberList - 成员列表
message MemberList {
    repeated Member members = 1;  // 成员列表
    int32 total = 2;              // 总成员数
}

// Settings - 社群设置
message Settings {
    string community_id = 1;        // 社群ID
    bool need_verify = 2;           // 是否需要审核
    bool allow_private_chat = 3;    // 是否允许单聊
    bool allow_add_friend = 4;      // 是否允许添加好友
    bool pause_invite = 5;          // 是否暂停邀请
    bool allow_access_other_channels = 6;  // 是否允许访问其他频道
    int32 new_member_speak_time = 7;  // 新加入用户发言时间要求（分钟）
    int32 speak_frequency_limit = 8;  // 发言频率限制（条/分钟）
    int32 speak_type_limit = 9;      // 发言类型限制（位掩码）
    int32 speak_count_limit = 10;     // 发言数量限制（条/周期）
}

// PermissionConfig - 权限配置
message PermissionConfig {
    string community_id = 1;     // 社群ID
    string permission_id = 2;    // 权限ID
    string config_data = 3;      // 权限配置（JSON格式）
    bool is_enabled = 4;         // 是否启用
}

// RolePermission - 角色权限
message RolePermission {
    string role_code = 1;              // 角色代码（super_admin、member等）
    string role_name = 2;              // 角色名称
    repeated string permissions = 3;    // 权限列表
}

// RolePermissions - 角色权限列表
message RolePermissions {
    string community_id = 1;           // 社群ID
    repeated RolePermission roles = 2;  // 角色权限列表
}

// CommChannelSettings - 频道设置
message CommChannelSettings {
    string channel_id = 1;        // 频道ID
    bool pause_invite = 2;        // 是否暂停邀请
    bool mute_all = 3;            // 是否禁止发言
    int32 notification_type = 4;  // 通知类型
}

// CommCheckResult - 检查结果
message CommCheckResult {
    bool allowed = 1;  // 是否允许
    string reason = 2;  // 原因（如果不允许）
}

// ========== 操作对象 ==========

// Join - 加入社群
message Join {
    string community_id = 1;  // 社群ID（必填）
    string invite_code = 2;   // 邀请码（可选）
    string invite_link = 3;   // 邀请链接（可选）
}

// Leave - 离开社群
message Leave {
    string community_id = 1;  // 社群ID（必填）
}

// MuteMember - 禁言成员
message MuteMember {
    string community_id = 1;  // 社群ID（必填）
    string user_id = 2;      // 用户ID（必填）
    bool mute = 3;           // 是否禁言（true=禁言，false=解除禁言）
}

// KickMember - 踢出成员
message KickMember {
    string community_id = 1;  // 社群ID（必填）
    string user_id = 2;      // 用户ID（必填）
}

// BanMember - 封禁成员
message BanMember {
    string community_id = 1;  // 社群ID（必填）
    string user_id = 2;       // 用户ID（必填）
    bool ban = 3;             // 是否封禁（true=封禁，false=解除封禁）
}

// CommUpdateSettings - 更新社群设置
message CommUpdateSettings {
    string community_id = 1;        // 社群ID（必填）
    bool need_verify = 2;           // 是否需要审核（可选）
    bool allow_private_chat = 3;    // 是否允许单聊（可选）
    bool allow_add_friend = 4;       // 是否允许添加好友（可选）
    bool pause_invite = 5;          // 是否暂停邀请（可选）
    bool allow_access_other_channels = 6;  // 是否允许访问其他频道（可选）
    int32 new_member_speak_time = 7;  // 新加入用户发言时间要求（可选）
    int32 speak_frequency_limit = 8;  // 发言频率限制（可选）
    int32 speak_type_limit = 9;      // 发言类型限制（可选）
    int32 speak_count_limit = 10;     // 发言数量限制（可选）
}

// UpdatePermissionConfig - 更新权限配置
message UpdatePermissionConfig {
    string community_id = 1;     // 社群ID（必填）
    string permission_id = 2;    // 权限ID（必填）
    string config_data = 3;     // 权限配置（JSON格式，必填）
    bool is_enabled = 4;        // 是否启用（可选）
}

// UpdateRolePermissions - 更新角色权限
message UpdateRolePermissions {
    string community_id = 1;           // 社群ID（必填）
    string role_code = 2;              // 角色代码（必填）
    repeated string permissions = 3;    // 权限列表（必填）
}

// CreateCategory - 创建分类
message CreateCategory {
    string community_id = 1;  // 社群ID（必填）
    string category_name = 2;  // 分类名称（必填，2-50字符）
}

// UpdateCategory - 更新分类
message UpdateCategory {
    string category_id = 1;    // 分类ID（必填）
    string category_name = 2;  // 分类名称（必填，2-50字符）
}

// DeleteCategory - 删除分类
message DeleteCategory {
    string category_id = 1;  // 分类ID（必填）
}

// ReorderCategories - 重新排序分类
message ReorderCategories {
    string community_id = 1;              // 社群ID（必填）
    repeated string category_ids = 2;     // 分类ID列表（按新顺序排列）
}

// CreateCommChannel - 创建频道
message CreateCommChannel {
    string community_id = 1;  // 社群ID（必填）
    string category_id = 2;    // 分类ID（必填）
    string channel_name = 3;  // 频道名称（必填，2-50字符）
    int32 channel_type = 4;   // 频道类型（必填，1=文字频道，2=语音频道）
    string description = 5;    // 频道描述（可选）
    int32 max_members = 6;    // 最大成员数（可选，语音频道默认50）
}

// UpdateCommChannel - 更新频道
message UpdateCommChannel {
    string channel_id = 1;     // 频道ID（必填）
    string channel_name = 2;   // 频道名称（可选，2-50字符）
    bool pause_invite = 3;     // 是否暂停邀请（可选）
    bool mute_all = 4;         // 是否禁止发言（可选）
    int32 notification_type = 5;  // 通知类型（可选，1=所有通知，2=仅@我的，3=不通知）
}

// DeleteCommChannel - 删除频道
message DeleteCommChannel {
    string channel_id = 1;  // 频道ID（必填）
}

