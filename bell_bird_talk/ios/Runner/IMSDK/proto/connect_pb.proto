syntax = "proto3";

package com.cloud.im.common.core.protocol.connect;

option java_multiple_files = true;
option java_package = "com.cloud.im.common.core.protocol.connect";
option java_outer_classname = "ConnectProtos";

import "device_pb.proto";

// 用户登录成功请求
message UserLoginSuccessRequest {
  string app_id = 1;        // 应用ID
  string client_id = 2;     // 客户端ID
  string user_id = 3;       // 用户ID
}

// 用户登录成功响应
message UserLoginSuccessResponse {
  bool success = 1;         // 是否成功
  string message = 2;       // 响应消息
}

// 踢出原因枚举
enum KickReason {
  // 用户主动场景 (0-99)
  PASSWORD_CHANGED = 0;           // 密码已修改（默认值）
  USER_LOGOUT_OTHER = 1;          // 用户登出其他设备
  NEW_DEVICE_LOGIN = 2;           // 新设备登录
  ACCOUNT_DEACTIVATED=3;          // 账号注销
  // 系统规则场景 (100-199)
  MULTI_DEVICE_LIMIT = 100;       // 超出多端设备限制
  SESSION_EXPIRED = 101;          // 会话过期
  SECURITY_POLICY = 102;          // 安全策略触发

  
  // 管理场景 (200-299)
  USER_BANNED = 200;              // 用户被封禁
  ADMIN_KICK = 201;               // 管理员踢出
  SYSTEM_MAINTENANCE = 202;       // 系统维护
  VIOLATION = 203;                // 违规操作
  
  // 系统异常场景 (300-399)
  DUPLICATE_LOGIN = 300;          // 重复登录
  ABNORMAL_BEHAVIOR = 301;        // 异常行为
}

// 踢出请求消息（微服务间调用）
message Kick {
  string app_id = 1;                    // 应用ID
  string user_id = 2;                   // 用户ID（可选）
  repeated string device_ids = 3;       // 设备ID列表（可选）
  KickReason reason = 4;                // 踢出原因
  string reason_desc = 5;               // 踢出原因描述（可选）
  string operator_id = 6;               // 操作者ID
  bool allow_reconnect = 7;             // 是否允许重连
  int32 delay_seconds = 8;              // 延迟断开时间（秒）
  bool force_disconnect = 9;            // 是否强制断开（不发通知）
  map<string, string> extra = 10;       // 扩展数据
  int64 timestamp = 11;                 // 时间戳
}

// 踢出结果消息（内部记录用，可选）
message KickResult {
  bool success = 1;                     // 是否成功
  int32 kicked_count = 2;               // 实际踢出的连接数
  string error_msg = 3;                 // 错误信息
  repeated string failed_devices = 4;   // 踢出失败的设备列表
  int64 process_time_ms = 5;            // 处理耗时（毫秒）
}

// 踢出通知消息（发送给客户端）
message KickNotify {
  int32 reason_code = 1;                // 踢出原因代码（对应 KickReason 枚举值）
  string reason_desc = 2;               // 踢出原因描述
  string user_msg = 3;                  // 用户友好消息
  bool allow_reconnect = 4;             // 是否允许重连
  int32 delay_seconds = 5;              // 延迟断开时间
  string operator_id = 6;               // 操作者ID
  int64 timestamp = 7;                  // 时间戳
  map<string, string> extra = 8;        // 扩展数据
}

// ========== 在线状态查询 ==========

// ============ 查询操作 ============

// 查询用户在线状态 - 查询操作
message ConnectCheck {
  string user_id = 1;                   // 用户ID（必填）
  string device_id = 2;                 // 设备ID（可选，如果提供则检查特定设备）
}

// 批量查询用户在线状态 - 查询操作
message BatchConnectCheck {
  repeated string user_ids = 1;         // 用户ID列表（必填，最多100个）
}

// ============ 结果对象 ============

// 用户在线状态 - 结果对象
message Status {
  string user_id = 1;                   // 用户ID
  bool is_online = 2;                   // 是否在线
  int32 device_count = 3;               // 在线设备数量
  repeated .im.device.Device devices = 4; // 在线设备列表（可选，使用 device_pb.Device）
}

// 用户在线状态列表 - 批量查询结果对象
message StatusList {
  repeated Status statuses = 1;         // 用户在线状态列表
} 