syntax = "proto3";

package im.conv;

option java_package = "com.cloud.im.common.core.protocol.conv";
option java_outer_classname = "ConvPb";

import "system_pb.proto";

// =====================================
// 会话类型枚举
// =====================================

// 会话类型（单聊/群聊/系统/社区）
enum ConversationType {
  ALL = 0;         // 查询所有类型（protobuf 要求第一个值必须是 0）
  SINGLE = 1;      // 单聊
  GROUP = 2;       // 群聊
  SYSTEM = 3;     // 系统
  COMMUNITY = 4;  // 社区
}

// =====================================
// 会话核心数据结构
// =====================================

// 会话信息 - 核心领域对象
// 创建时必要参数：conv_type, display_name
// 更新时必要参数：conv_id + 要更新的字段
message Conv {
  string conv_id = 1;               // 会话ID（创建时自动生成）
  string parent_id = 2;             // 父会话ID
  ConversationType conv_type = 3;  // 会话类型（创建时必需）
  int32 level = 4;                  // 层级深度
  string display_name = 5;          // 显示名称（创建时必需）
  string description = 6;           // 描述
  string avatar_url = 7;            // 头像URL
  string avatar_bg = 15;             // 头像背景色（可选，当avatar_url为空时使用，格式：#色值1 或 #色值1&#色值2）
  string avatar_info = 8;           // 头像详细信息(JSON)
  string target_id = 9;             // 目标对象ID（单聊=对方用户ID，群聊=群ID等）
  int32 status = 10;                // 状态
  bool is_private = 11;             // 是否私有
  int64 created_at = 12;            // 创建时间
  int64 updated_at = 13;            // 更新时间
  string extra_info = 14;           // 扩展信息(JSON)

  // 标签：系统级与用户自定义（用户自定义为"当前请求用户"的个性化标签）
  repeated string sys_tags = 22;     // 系统标签（全局一致）
  repeated string user_tags = 23;    // 用户个性化标签（随请求用户变化）
  
  // 用户个性化设置
  bool disturb = 50;                  // 是否免打扰（true=免打扰，false=不免打扰）
}

// 成员信息/权限由其他服务负责

// =====================================
// 请求和响应消息
// =====================================

// 获取会话请求 - 必要参数：conv_id
message GetConv {
  string conv_id = 1;               // 会话ID（必需）
}

// 删除会话请求 - 必要参数：conv_id
message DeleteConv {
  string conv_id = 1;               // 会话ID（必需）
}

// 会话列表查询请求 - 用于 list 方法
message ConvListQuery {
  ConversationType conv_type = 1;  // 会话类型过滤（可选：SINGLE/GROUP/ALL，默认ALL）
  com.cloud.im.common.core.system.Page page = 2;  // 分页参数（可选，使用系统类型）
  bool with_unread = 3;            // 返回结果是否带未读数（可选：true=带未读数，false=不带未读数，默认false）
}

// 未读会话列表查询请求 - 用于 listUnread 方法（固定只返回未读会话）
message ListUnreadQuery {
  ConversationType conv_type = 1;  // 会话类型过滤（可选：SINGLE/GROUP/ALL，默认ALL）
  com.cloud.im.common.core.system.Page page = 2;  // 分页参数（可选，使用系统类型）
  bool mention_only = 3;           // 只返回@消息会话（可选：true=有@消息，false=无@消息，不设置=全部）
}

// 会话列表响应
message ConvList {
  repeated Conv convs = 1;          // 会话列表
  int64 total_count = 2;            // 总数
  int32 page = 3;                   // 当前页
  int32 size = 4;                   // 页面大小
}

// =====================================
// 未读计数相关消息
// =====================================

// 获取未读数请求 - 必要参数：user_id，可选参数：conv_id
message UnreadQuery {
  string user_id = 1;               // 用户ID（必需）
  string conv_id = 2;               // 会话ID（可选，为空时返回全部）
}

// 未读数响应
message UnreadStats {
  int64 total_unread = 1;           // 总未读数
  map<string, int32> conv_unread = 2;  // 各会话未读数
  int64 version = 3;                // 版本号
}

// 未读预览请求 - 获取用户的未读统计信息（分组统计）
message UnreadPreview {
  // 不需要参数，从消息上下文中获取 user_id
}

// 未读预览响应 - 返回用户的未读统计信息（分组统计）
message UnreadPreviewResult {
  int64 total_unread = 1;           // 总未读数（单聊+群组）
  int64 unread_single = 2;          // 单聊未读数
  int64 unread_group = 3;           // 群组未读数（GROUP + COMMUNITY）
  int64 unread_mention = 4;        // @消息未读数（所有@我的未读消息数）
  int64 update_version = 5;         // 更新版本号（用于缓存失效）
}

// 更新阅读位置请求 - 必要参数：conv_id, read_seq
message UpdateReadPosition {
  string conv_id = 1;               // 会话ID（必需）
  int64 read_seq = 2;               // 读到的消息序号（必需）
  string device_id = 3;             // 设备ID（可选）
  string message_id = 4;            // 消息ID（可选）
}

// 更新阅读位置响应
message ReadStatus {
  bool success = 1;                 // 是否成功
  int32 new_unread_count = 2;       // 新的会话未读数
  int64 total_unread = 3;           // 用户总未读数
}

// 带未读数的会话信息
message ConvWithUnread {
  Conv conv = 1;                    // 会话信息
  int32 unread_count = 2;           // 未读数量
  int64 last_read_seq = 3;          // 最后阅读位置
  int64 conv_max_seq = 4;           // 会话最大序号
}

// 带未读数的会话列表响应
message ListWithUnread {
  repeated ConvWithUnread convs = 1; // 会话列表
  int64 total_unread = 2;           // 用户总未读数
  bool has_more = 3;                // 是否还有更多
  int32 page = 4;                   // 当前页
  int32 size = 5;                   // 页面大小
  int64 version = 6;                // 版本号
}

// =====================================
// 未读计数操作相关消息
// =====================================

// 增加未读计数请求 - 必要参数：conv_id, user_id
message IncrementUnread {
  string conv_id = 1;               // 会话ID（必需）
  string user_id = 2;               // 用户ID（必需）
  int32 increment = 3;              // 增加数量（默认1）
}

// 增加未读计数响应
message UnreadResult {
  bool success = 1;                 // 是否成功
  int32 new_unread_count = 2;       // 新的未读数
  int64 total_unread = 3;           // 用户总未读数
}

// 更新会话统计信息请求 - 必要参数：conv_id, message_info
message UpdateStats {
  string conv_id = 1;               // 会话ID（必需）
  string message_id = 2;            // 消息ID
  int64 message_time = 3;           // 消息时间（毫秒时间戳）
  string sender_id = 4;             // 发送者ID
  string message_preview = 5;       // 消息预览（可选）
}

// 更新拉取时间请求 - 必要参数：conv_id, user_id
message UpdatePullTime {
  string conv_id = 1;               // 会话ID（必需）
  string user_id = 2;               // 用户ID（必需）
  int64 pull_time = 3;              // 拉取时间（毫秒时间戳）
}

// =====================================
// 批量操作相关消息（群组场景）
// =====================================

// 批量增加未读数 - 操作对象
// 用于群消息发送时批量更新所有成员的未读数
message BatchIncrementUnread {
  string conv_id = 1;               // 会话ID（群组ID）
  repeated string user_ids = 2;      // 用户ID列表
  int32 increment = 3;               // 增量（默认1）
}

// 批量增加未读数结果 - 结果对象
message BatchIncrementUnreadResult {
  bool success = 1;                 // 是否成功
  int32 updated_count = 2;           // 成功更新的用户数
}

// 批量建立用户会话关系请求
// 用于群消息分发时批量创建群成员的 user_state 记录
// 注意：通过 InnerBatchMessage 的 toUsers() 传递目标用户列表
message BatchCreateUserStates {
  string conv_id = 1;              // 会话ID（必需）
  ConversationType conv_type = 2;   // 会话类型（必需，群聊=GROUP）
  string source_id = 3;            // 会话发起方ID（群聊=创建者ID）
  string display_name = 4;         // 显示名称（可选，群聊=群名称）
}

// 批量建立用户会话关系结果
message BatchCreateUserStatesResult {
  bool success = 1;                 // 是否成功
  int32 created_count = 2;          // 成功创建的用户数
  int32 skipped_count = 3;          // 跳过数（已存在）
  int32 failed_count = 4;           // 失败数
}

// =====================================
// 免打扰相关消息
// =====================================

// 设置免打扰请求
message Disturb {
  string conv_id = 1;               // 会话ID（必需）
  bool disturb = 2;                 // 是否免打扰（必需，true=免打扰，false=取消免打扰）
}

// 设置免打扰响应
message DisturbState {
  bool success = 1;                 // 是否成功
  bool disturb = 2;                 // 当前免打扰状态
}


