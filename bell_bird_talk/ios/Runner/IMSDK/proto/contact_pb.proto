syntax = "proto3";

package im.contact;

option java_package = "com.cloud.im.common.core.protocol.contact";
option java_outer_classname = "ContactProtos";

import "app_pb.proto";

// ========== 枚举定义 ==========
enum AddChannel {
  USER_ID = 0;              // 用户ID添加
  USERNAME = 1;             // 用户名添加
  PHONE = 2;                // 手机号添加
  EMAIL = 3;                // 邮箱添加
  INVITE_CODE = 4;          // 邀请码添加
  QR_CODE = 5;              // 二维码添加
  BUSINESS_CARD = 6;        // 名片分享添加
  GROUP_MEMBER = 7;         // 群组添加
  PHONE_CONTACTS = 8;       // 通讯录导入
  RECOMMENDATION = 9;       // 系统推荐
}

enum Relationship {
  ALL = 0;                   // 所有
  FRIEND = 1;               // 好友
  FOLLOW = 2;               // 关注
  RELATIONSHIP_PENDING = 4; // 待确认
  // 注意：BLOCKED 已移除，拉黑关系独立存储，使用 blockList 方法查询
}

enum RequestStatus {
  PENDING = 0;      // 待处理
  ACCEPTED = 1;     // 已同意
  REJECTED = 2;     // 已拒绝
  EXPIRED = 3;      // 已过期
  CANCELLED = 4;    // 已取消
}

//拉黑方向
enum BlockDirection{
  NONE = 0;       //没有拉黑
  SELF = 1;       //自己给对方拉黑
  OTHER = 2;      // 自己被对方拉黑
  BOTH = 3;       //双方互拉黑

}

// ========== 核心领域对象：Contact ==========
// Contact 领域对象 - add 方法的请求参数
message Contact {
  // 返回字段（系统自动填充，请求时不需要）
  string contact_user_id = 1;        // 联系人用户ID（返回字段，请求时不需要）
  string account_id = 2;              // 账户ID（返回字段，原用户名）
  string nickname = 3;              // 昵称（返回字段）
  string avatar = 4;                // 头像（返回字段）
  string remark = 5;                // 备注名（返回字段）
  Relationship relationship = 6;     // 关系类型（返回字段）
  int32 online_status = 7;          // 在线状态（返回字段）
  repeated Tag tags = 9;            // 标签列表（返回字段）
  int64 create_time = 10;           // 添加时间（返回字段，系统自动生成）
  int64 last_chat_time = 11;        // 最后聊天时间（返回字段）
  string group_name = 15;           // 群组名称（返回字段）
  int64 contact_group_id = 20;     // 联系人所属分组ID（请求/返回字段：add方法请求时可指定分组ID，返回时返回分组ID）
  ContactGroup contact_group = 21;  // 联系人所属分组详情（返回字段，新增）

  // add 方法请求字段
  AddChannel add_channel = 8;       // 添加渠道（必填）
  string target_value = 12;         // 目标值（必填，用户ID/用户名/手机号等）
  string message = 13;              // 申请消息（可选，最大长度500字符）
  int64 group_id = 14;              // 所属群组ID（可选，当渠道为GROUP_MEMBER时使用）
  repeated int64 tag_ids = 16;      // 标签ID列表（可选，为新好友添加的标签）

  // 用户信息验证字段（可选，用于验证）
  string target_phone = 17;         // 目标手机号（可选，用于验证）
  string target_email = 18;         // 目标邮箱（可选，用于验证）
  string target_account_id = 19;      // 目标账户ID（可选，用于验证，原用户名）
}

// ContactQuery - list/search/get 方法的查询参数
message ContactQuery {
  // list 方法字段（全部可选）
  Relationship relationship = 1;     // 关系类型过滤（可选）
  repeated int64 tag_ids = 2;       // 标签过滤（可选）
  int32 page = 3;                   // 分页（可选，默认1）
  int32 page_size = 4;              // 页面大小（可选，默认20，最大100）

  // search 方法字段
  string keyword = 5;               // 搜索关键词（可选）
  AddChannel search_type = 6;       // 搜索类型（可选）

  // get 方法字段
  string contact_user_id = 7;        // 联系人用户ID（get方法必填，list/search方法不需要）

  // 分组过滤字段
  int64 group_id = 8;                // 分组ID过滤（可选，用于按分组过滤联系人）
}

// ContactList - list/search 方法的返回结果
message ContactList {
  repeated Contact contacts = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// ContactRemark - updateRemark 方法的参数
message ContactRemark {
  string contact_user_id = 1;        // 联系人用户ID（必填）
  string remark = 2;                // 新备注名（可选，最大长度100字符）
}

// ========== 核心领域对象：Tag ==========
// Tag 领域对象 - create/update 方法的参数
message Tag {
  // 返回字段（系统自动填充，请求时不需要）
  int64 tag_id = 1;                 // 标签ID（返回字段，create时不需要，update时必填）
  int32 contact_count = 4;          // 使用该标签的联系人数量（返回字段）
  int64 create_time = 5;            // 创建时间（返回字段，系统自动生成）

  // create/update 方法请求字段
  string tag_name = 2;              // 标签名称（create必填，update可选，最大长度20字符）
  string tag_color = 3;             // 标签颜色（可选，十六进制色值，格式：#RRGGBB）
}

// TagQuery - list/delete 方法的查询参数
message TagQuery {
  // list 方法字段
  int32 page = 1;                   // 分页（可选，默认1）
  int32 page_size = 2;              // 页面大小（可选，默认20，最大100）

  // delete 方法字段
  int64 tag_id = 3;                 // 标签ID（delete方法必填，list方法不需要）
}

// TagList - list 方法的返回结果
message TagList {
  repeated Tag tags = 1;
  int32 total_count = 2;
}

// ContactTag - addContactTag/removeContactTag 方法的参数
message ContactTag {
  string contact_user_id = 1;        // 联系人用户ID（必填）
  repeated int64 tag_ids = 2;       // 标签ID列表（必填，至少包含一个标签ID）
}

// ========== 核心领域对象：Request ==========
// Request 领域对象 - accept/reject/listRequests 方法的参数和返回结果
message Request {
  // 返回字段（系统自动填充，请求时不需要）
  string requester_id = 2;           // 申请人ID（返回字段）
  string requester_name = 3;        // 申请人姓名（返回字段）
  string requester_avatar = 4;      // 申请人头像（返回字段）
  string message = 5;               // 申请消息（返回字段）
  AddChannel channel = 6;           // 添加渠道（返回字段）
  RequestStatus status = 7;         // 申请状态（返回字段）
  int64 request_time = 8;           // 申请时间（返回字段）
  int64 expire_time = 9;            // 过期时间（返回字段）

  // accept/reject 方法请求字段
  int64 request_id = 1;              // 申请ID（必填）
  repeated int64 tag_ids = 10;      // 标签ID列表（可选，accept方法使用，为新好友添加的标签）
  string reason = 11;               // 拒绝原因（可选，reject方法使用，最大长度500字符）
}

// RequestQuery - listRequests 方法的查询参数
message RequestQuery {
  RequestStatus status = 1;          // 状态过滤（可选，默认REQUEST_PENDING）
  int32 page = 2;                    // 页码（可选，默认1，从1开始）
  int32 page_size = 3;               // 每页数量（可选，默认20，最大100）
}

// RequestList - listRequests 方法的返回结果
message RequestList {
  repeated Request requests = 1;     // 好友申请列表
  int32 total_count = 2;             // 总数量
  int32 page = 3;                    // 当前页
  int32 page_size = 4;               // 页面大小
}

// ========== 核心领域对象：Block ==========
// Block 领域对象 - block/unblock 方法的参数
message Block {
  string target_user_id = 1;         // 目标用户ID（必填）
}

// BlockCheck - checkBlockStatus 方法的参数
message BlockCheck {
  string target_user_id = 1;         // 目标用户ID（必填，检查我是否被该用户拉黑）
}

// BlockCheckResult - checkBlockStatus 方法的返回结果
message BlockCheckResult {
  BlockDirection block_direction = 3;        // 拉黑方向：NONE/SELF/OTHER/BOTH
}

// ========== 核心领域对象：QRCode ==========
// QRCode 领域对象 - generate 方法的参数和返回对象
message QRCode {
  // generate 方法请求参数
  int32 expire_minutes = 1;         // 二维码有效期（可选，单位：分钟，默认30分钟）
  bool allow_group_invite = 2;      // 是否允许群组邀请（可选，默认false）

  // generate 方法返回结果（系统自动填充，请求时不需要）
  string qr_token = 3;              // 二维码令牌（返回字段）
  string qr_url = 4;                // 二维码图片URL（返回字段）
  int64 expire_time = 5;            // 过期时间戳（返回字段）
}

// QRScan - scan 方法的参数
message QRScan {
  string qr_token = 1;              // 扫描得到的令牌（必填）
  string message = 2;               // 申请消息（可选，最大长度500字符）
  repeated int64 tag_ids = 3;       // 标签ID列表（可选，为新好友添加的标签）
}

// ========== 核心领域对象：BusinessCard ==========
// BusinessCard 领域对象 - generate 方法的参数和返回对象
message BusinessCard {
  // generate 方法请求参数（全部可选）
  bool include_phone = 1;           // 是否包含手机号（可选，默认true）
  bool include_email = 2;           // 是否包含邮箱（可选，默认true）
  string custom_message = 3;        // 自定义消息（可选，最大长度500字符）

  // generate 方法返回结果（系统自动填充，请求时不需要）
  string card_token = 4;            // 名片令牌（返回字段）
  string card_url = 5;              // 名片分享链接（返回字段）
  string card_qr_code = 6;          // 名片二维码（返回字段）
}

// ========== 核心领域对象：PhoneContacts ==========
// PhoneContact - 单个通讯录联系人
message PhoneContact {
  string name = 1;                  // 联系人姓名（必填）
  string phone = 2;                 // 电话号码（必填）
  string email = 3;                 // 邮箱（可选）
}

// PhoneContacts 领域对象 - import 方法的参数
message PhoneContacts {
  repeated PhoneContact contacts = 1;
}

// PhoneContactsResult - import 方法的返回结果
message PhoneContactsResult {
  repeated MatchedContact matched = 1;
  int32 total_imported = 2;
  int32 total_matched = 3;
}

// MatchedContact - 匹配结果
message MatchedContact {
  PhoneContact phone_contact = 1;
  Contact user_info = 2;            // 匹配到的用户信息
  bool already_friend = 3;          // 是否已是好友
}

// ========== 用户解析相关协议 ==========

// UserResolution - 用户解析请求
message UserResolution {
  string target_value = 1;           // 目标值（必填，用户ID/用户名/手机号/邮箱等）
  AddChannel channel = 2;            // 解析渠道（必填）
  bool include_profile = 3;          // 是否包含用户资料（可选，默认true）
  bool check_existence = 4;          // 是否检查用户存在性（可选，默认true）
}

// UserResolutionResult - 用户解析结果
message UserResolutionResult {
  bool found = 1;                    // 是否找到用户
  string user_id = 2;                // 解析到的用户ID
  string account_id = 3;               // 账户ID（原用户名）
  string nickname = 4;               // 昵称
  string avatar = 5;                 // 头像
  string phone = 6;                  // 手机号
  string email = 7;                  // 邮箱
  bool is_active = 8;                // 是否活跃
  bool is_blocked = 9;               // 是否被拉黑
  int64 last_active_time = 10;       // 最后活跃时间
  string resolution_error = 11;      // 解析错误信息
}

// ========== 业务规则验证协议 ==========

// BusinessRuleValidation - 业务规则验证请求
message BusinessRuleValidation {
  string user_id = 1;                // 用户ID（必填）
  string target_user_id = 2;         // 目标用户ID（必填）
  AddChannel channel = 3;            // 添加渠道（必填）
  bool is_admin = 4;                 // 是否管理员（可选，默认false）
  int32 current_friend_count = 5;    // 当前好友数量（可选，系统自动获取）
  int32 daily_add_count = 6;         // 今日添加次数（可选，系统自动获取）
}

// BusinessRuleValidationResult - 业务规则验证结果
message BusinessRuleValidationResult {
  bool valid = 1;                    // 是否通过验证
  repeated string errors = 2;        // 错误信息列表
  repeated string warnings = 3;       // 警告信息列表
  int32 max_friends_allowed = 4;     // 允许的最大好友数
  int32 remaining_daily_adds = 5;    // 剩余每日添加次数
  int64 next_reset_time = 6;         // 下次重置时间
}

// ========== 并发控制协议 ==========

// ConcurrencyControl - 并发控制请求
message ConcurrencyControl {
  string operation_key = 1;          // 操作唯一标识（必填）
  int32 timeout_seconds = 2;         // 超时时间（可选，单位：秒，默认30秒）
  bool allow_retry = 3;              // 是否允许重试（可选，默认false）
}

// ConcurrencyControlResult - 并发控制结果
message ConcurrencyControlResult {
  bool acquired = 1;                 // 是否获得锁
  string lock_id = 2;                // 锁ID
  int64 expire_time = 3;             // 过期时间
  string error_message = 4;          // 错误信息
}

// ========== 增强的响应消息 ==========

// ContactAddResult - 添加联系人结果
// 注意：此方法需要返回额外信息（request_id、requires_approval），因此使用自定义结果类型
// 其他操作方法（remove、updateRemark、acceptRequest等）使用 system.EmptyResponse
message ContactAddResult {
  bool success = 1;                  // 是否成功
  int32 error_code = 2;              // 错误码（使用系统统一错误码）
  string error_message = 3;          // 错误信息
  string contact_user_id = 4;         // 联系人用户ID
  int64 add_time = 5;                // 添加时间
  bool requires_approval = 6;         // 是否需要对方确认（从配置获取）
  int64 request_id = 7;               // 申请ID（如果需要确认）
  repeated string warnings = 8;       // 警告信息
}

// ValidationResult - 验证结果
message ValidationResult {
  bool valid = 1;                    // 是否通过验证
  repeated im.app.ValidationError errors = 2; // 验证错误（使用 app_pb.proto 中的定义）
  repeated im.app.ValidationWarning warnings = 3; // 验证警告（使用 app_pb.proto 中的定义）
}

// ========== 配置管理协议 ==========

// ContactConfigRequest - 配置查询请求
message ContactConfigRequest {
  string app_id = 1;                 // 应用ID（必填）
  string config_category = 2;        // 配置分类（必填）
  string config_key = 3;             // 配置键（可选，用于查询单个配置）
  bool include_disabled = 4;         // 是否包含禁用的配置（可选，默认false）
}

// ContactConfigItem - 配置项
message ContactConfigItem {
  string config_key = 1;             // 配置键
  string config_value = 2;           // 配置值
  string config_type = 3;             // 配置类型
  string config_desc = 4;             // 配置描述
  bool is_enabled = 5;                // 是否启用
  int32 priority = 6;                 // 优先级
  int32 sort_order = 7;               // 排序
  int64 create_time = 8;              // 创建时间
  int64 update_time = 9;              // 更新时间
}

// ContactConfigResponse - 配置查询响应
message ContactConfigResponse {
  bool success = 1;                   // 是否成功
  string error_code = 2;              // 错误码
  string message = 3;                  // 消息
  string config_category = 4;         // 配置分类
  repeated ContactConfigItem configs = 5; // 配置列表
}

// ========== 核心领域对象：ContactGroup ==========
// ContactGroup 领域对象 - 联系人分组
message ContactGroup {
  int64 group_id = 1;                 // 分组ID
  string group_name = 2;              // 分组名称
  string group_color = 3;            // 分组颜色（十六进制色值）
  int32 group_order = 4;               // 排序权重
  string group_icon = 5;              // 分组图标
  string group_description = 6;        // 分组描述
  int32 contact_count = 7;             // 该分组中的联系人数量
  int64 create_time = 8;               // 创建时间
  int64 update_time = 9;               // 更新时间
}

// GroupQuery - 分组查询参数
message GroupQuery {
  int32 page = 1;                     // 分页（可选）
  int32 page_size = 2;                // 页面大小
  int64 group_id = 3;                 // 分组ID（用于查询单个分组）
}

// GroupList - 分组列表响应
message GroupList {
  repeated ContactGroup groups = 1;    // 分组列表
  int32 total_count = 2;              // 总数量
}

// GroupCreate - 创建分组请求
message GroupCreate {
  string group_name = 1;               // 分组名称（必填）
  string group_color = 2;             // 分组颜色（可选）
  int32 group_order = 3;              // 排序权重（可选）
  string group_icon = 4;              // 分组图标（可选）
  string group_description = 5;       // 分组描述（可选）
}

// GroupUpdate - 更新分组请求
message GroupUpdate {
  int64 group_id = 1;                 // 分组ID（必填）
  string group_name = 2;              // 分组名称（可选）
  string group_color = 3;             // 分组颜色（可选）
  int32 group_order = 4;              // 排序权重（可选）
  string group_icon = 5;              // 分组图标（可选）
  string group_description = 6;       // 分组描述（可选）
}

// ContactMoveToGroup - 移动联系人到分组
message ContactMoveToGroup {
  string contact_user_id = 1;         // 联系人用户ID（必填）
  int64 group_id = 2;                 // 目标分组ID（必填，0表示移除分组）
}