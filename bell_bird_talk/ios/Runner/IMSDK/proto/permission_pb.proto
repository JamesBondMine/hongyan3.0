syntax = "proto3";

package im.permission;

import "system_pb.proto";
option java_package = "com.cloud.im.common.core.protocol.permission";
option java_outer_classname = "PermissionProtos";

// ========== 枚举类型 ==========

// 业务模型枚举（与 BizModel 对应）
// 注意：Protobuf 枚举值从 0 开始，需要与 Java BizModel 枚举的 code 值映射
enum BizModel {
  PUB = 0;         // 公共（对应 Java BizModel.PUB.code = 0）
  CNN = 1;         // 连接（对应 Java BizModel.CNN.code = 1）
  CHAT = 2;        // 聊天（对应 Java BizModel.CHAT.code = 2）
  GROUP = 3;       // 群组（对应 Java BizModel.GROUP.code = 3）
  SYSTEM = 4;      // 系统（对应 Java BizModel.SYSTEM.code = 4）
  USER = 5;        // 用户（对应 Java BizModel.USER.code = 5）
  CONVERSATION = 6; // 会话（对应 Java BizModel.CONVERSATION.code = 6）
  AUTH = 7;        // 鉴权（对应 Java BizModel.AUTH.code = 7）
  HANDSHAKE = 8;   // 密钥协商（对应 Java BizModel.HANDSHAKE.code = 8）
  APP = 9;         // 应用（对应 Java BizModel.APP.code = 9）
  CAPTCHA = 10;    // 验证码（对应 Java BizModel.CAPTCHA.code = 10）
  CONTACT = 11;    // 通讯录（对应 Java BizModel.CONTACT.code = 11）
  CLUSTER = 12;    // 集群（对应 Java BizModel.CLUSTER.code = 12）
  DEVICE = 13;     // 设备（对应 Java BizModel.DEVICE.code = 13）
  SENSITIVE = 14;  // 敏感词（对应 Java BizModel.SENSITIVE.code = 14）
  INVITE = 15;     // 邀请码（对应 Java BizModel.INVITE.code = 15）
  BAN = 16;        // 封禁管理（对应 Java BizModel.BAN.code = 16）
  PUSH = 17;       // 推送（对应 Java BizModel.PUSH.code = 17）
  CMTY = 18;       // 社群（对应 Java BizModel.CMTY.code = 18）
  FILE = 19;       // 文件（对应 Java BizModel.FILE.code = 19）
  TRANSLATE = 20;  // 翻译（对应 Java BizModel.TRANSLATE.code = 20）
  CMCH = 21;       // 频道（对应 Java BizModel.CMCH.code = 21）
}

// 角色状态枚举
enum RoleStatus {
  ENABLED = 0;   // 启用（默认值）
  DISABLED = 1;  // 禁用
}

// ========== 核心领域对象（不加前缀）==========

// PermissionRole - 角色信息（RBAC）
message PermissionRole {
  string role_code = 1;        // 角色代码（必填）
  string role_name = 2;        // 角色名称（必填）
  string role_description = 3; // 角色描述（可选）
  BizModel biz_model = 4;      // 业务模型（可选）
  int32 priority = 5;          // 优先级（必填）
  bool is_system = 6;         // 是否系统角色（必填）
  RoleStatus status = 7;      // 状态（必填）
  int64 create_time = 8;      // 创建时间（返回字段，系统自动生成，毫秒时间戳）
  int64 update_time = 9;      // 更新时间（返回字段，系统自动更新，毫秒时间戳）
}

// UserRole - 用户角色关系（RBAC）
message UserRole {
  string user_id = 1;         // 用户ID（必填）
  string resource_id = 2;     // 资源ID（必填，空字符串表示全局角色）
  string role_code = 3;       // 角色代码（必填）
  int64 expire_time = 4;      // 过期时间（可选，0表示永不过期，毫秒时间戳）
  int64 create_time = 5;     // 创建时间（返回字段，系统自动生成，毫秒时间戳）
}

// ResourcePermission - 资源权限（ABAC）
message ResourcePermission {
  string resource_id = 1;     // 资源ID（必填）
  string action = 2;          // 操作（必填）
  string user_id = 3;        // 用户ID（必填）
  bool has_permission = 4;    // 是否有权限（必填）
  string attributes = 5;      // 属性集合（可选，JSON格式）
  int64 expire_time = 6;      // 过期时间（可选，0表示永不过期，毫秒时间戳）
  int64 create_time = 7;     // 创建时间（返回字段，系统自动生成，毫秒时间戳）
}

// RoleDefinition - 角色定义
message RoleDefinition {
  string role_code = 1;       // 角色代码（必填）
  string role_name = 2;       // 角色名称（必填）
  string role_description = 3; // 角色描述（可选）
  BizModel biz_model = 4;     // 业务模型（可选）
  int32 priority = 5;         // 优先级（必填）
  bool is_system = 6;         // 是否系统角色（必填）
  RoleStatus status = 7;      // 状态（必填）
  int64 create_time = 8;      // 创建时间（返回字段，系统自动生成，毫秒时间戳）
  int64 update_time = 9;      // 更新时间（返回字段，系统自动更新，毫秒时间戳）
}

// ========== RBAC 查询操作（加 Perm 前缀，首字母大写）==========

// PermFetchRoles - 获取用户角色列表
message PermFetchRoles {
  BizModel biz_model = 1;    // 业务模型（必填）
  string user_id = 2;         // 用户ID（必填）
  string resource_id = 3;     // 资源ID（可选，空字符串表示全局角色）
}

// PermBatchFetchRoles - 批量获取用户角色
message PermBatchFetchRoles {
  BizModel biz_model = 1;    // 业务模型（必填）
  repeated string user_ids = 2; // 用户ID列表（必填）
  string resource_id = 3;     // 资源ID（可选）
}

// PermCheckUserHasRole - 检查用户是否拥有角色
message PermCheckUserHasRole {
  BizModel biz_model = 1;    // 业务模型（必填）
  string user_id = 2;         // 用户ID（必填）
  string resource_id = 3;     // 资源ID（必填）
  string role_code = 4;       // 角色代码（必填）
}

// PermGetUsersByRole - 获取拥有指定角色的用户列表
message PermGetUsersByRole {
  BizModel biz_model = 1;    // 业务模型（必填）
  string resource_id = 2;    // 资源ID（必填）
  string role_code = 3;       // 角色代码（必填）
}

// ========== RBAC 操作对象（加 Perm 前缀，首字母大写）==========

// PermAssignRole - 分配角色
message PermAssignRole {
  BizModel biz_model = 1;    // 业务模型（必填）
  string user_id = 2;        // 用户ID（必填）
  string resource_id = 3;    // 资源ID（必填）
  string role_code = 4;      // 角色代码（必填）
  int64 expire_time = 5;     // 过期时间（可选，0表示永不过期，毫秒时间戳）
}

// PermRevokeRole - 撤销角色
message PermRevokeRole {
  BizModel biz_model = 1;    // 业务模型（必填）
  string user_id = 2;        // 用户ID（必填）
  string resource_id = 3;    // 资源ID（必填）
  string role_code = 4;      // 角色代码（必填）
}

// PermUpdateRoleExpireTime - 更新角色过期时间
message PermUpdateRoleExpireTime {
  BizModel biz_model = 1;    // 业务模型（必填）
  string user_id = 2;        // 用户ID（必填）
  string resource_id = 3;    // 资源ID（必填）
  string role_code = 4;      // 角色代码（必填）
  int64 expire_time = 5;     // 过期时间（必填，毫秒时间戳）
}

// ========== RBAC 结果对象（加 Perm 前缀，首字母大写）==========

// PermRoleList - 角色列表
message PermRoleList {
  repeated string role_codes = 1; // 角色代码列表
}

// PermUserRoleMap - 用户角色映射
message PermUserRoleMap {
  map<string, PermRoleList> user_roles = 1; // 用户ID -> 角色列表
}

// PermUserList - 用户列表
message PermUserList {
  repeated string user_ids = 1; // 用户ID列表
}

// PermCheckResult - 检查结果
message PermCheckResult {
  bool has_role = 1;  // 是否拥有角色
}

// ========== ABAC 查询操作（加 Perm 前缀，首字母大写）==========

// PermCheckPermission - 检查资源权限
message PermCheckPermission {
  BizModel biz_model = 1;    // 业务模型（必填）
  string action = 2;         // 操作（必填）
  string resource_id = 3;    // 资源ID（必填）
  string user_id = 4;        // 用户ID（必填）
  string attributes = 5;     // 属性集合（可选，JSON格式）
}

// PermBatchCheckPermission - 批量检查权限
message PermBatchCheckPermission {
  BizModel biz_model = 1;    // 业务模型（必填）
  string action = 2;         // 操作（必填）
  string resource_id = 3;     // 资源ID（必填）
  repeated string user_ids = 4; // 用户ID列表（必填）
}

// PermGetResourcePermissions - 获取资源的所有权限配置
message PermGetResourcePermissions {
  BizModel biz_model = 1;    // 业务模型（必填）
  string resource_id = 2;     // 资源ID（必填）
}

// PermGetUserPermissions - 获取用户的所有权限
message PermGetUserPermissions {
  BizModel biz_model = 1;    // 业务模型（必填）
  string user_id = 2;        // 用户ID（必填）
}

// ========== ABAC 操作对象（加 Perm 前缀，首字母大写）==========

// PermGrantPermission - 授予权限
message PermGrantPermission {
  BizModel biz_model = 1;    // 业务模型（必填）
  string resource_id = 2;    // 资源ID（必填）
  string action = 3;         // 操作（必填）
  string user_id = 4;        // 用户ID（必填）
  string attributes = 5;     // 属性集合（可选，JSON格式）
  int64 expire_time = 6;     // 过期时间（可选，0表示永不过期，毫秒时间戳）
}

// PermRevokePermission - 撤销权限
message PermRevokePermission {
  BizModel biz_model = 1;    // 业务模型（必填）
  string resource_id = 2;     // 资源ID（必填）
  string action = 3;         // 操作（必填）
  string user_id = 4;        // 用户ID（必填）
}

// PermUpdatePermissionAttributes - 更新权限属性
message PermUpdatePermissionAttributes {
  BizModel biz_model = 1;    // 业务模型（必填）
  string resource_id = 2;    // 资源ID（必填）
  string action = 3;         // 操作（必填）
  string user_id = 4;        // 用户ID（必填）
  string attributes = 5;     // 属性集合（必填，JSON格式）
}

// ========== ABAC 结果对象（加 Perm 前缀，首字母大写）==========

// PermPermissionResult - 权限检查结果
message PermPermissionResult {
  bool has_permission = 1;   // 是否有权限
}

// PermPermissionMap - 权限映射
message PermPermissionMap {
  map<string, bool> user_permissions = 1; // 用户ID -> 是否有权限
}

// PermPermissionList - 权限列表
message PermPermissionList {
  repeated ResourcePermission permissions = 1; // 权限列表
}

// ========== Role Definition 查询操作（加 Perm 前缀，首字母大写）==========

// PermGetRoleDefinition - 获取角色定义
message PermGetRoleDefinition {
  string role_code = 1;      // 角色代码（必填）
}

// PermListRoleDefinitions - 获取角色定义列表
message PermListRoleDefinitions {
  BizModel biz_model = 1;    // 业务模型（可选，0表示查询所有）
}

// PermGetRoleByPriority - 按优先级获取角色列表
message PermGetRoleByPriority {
  BizModel biz_model = 1;    // 业务模型（可选）
  int32 min_priority = 2;    // 最小优先级（可选）
  int32 max_priority = 3;    // 最大优先级（可选）
}

// ========== Role Definition 操作对象（加 Perm 前缀，首字母大写）==========

// PermCreateRoleDefinition - 创建角色定义
message PermCreateRoleDefinition {
  string role_code = 1;      // 角色代码（必填）
  string role_name = 2;      // 角色名称（必填）
  string role_description = 3; // 角色描述（可选）
  BizModel biz_model = 4;    // 业务模型（可选）
  int32 priority = 5;        // 优先级（可选，默认0）
  bool is_system = 6;        // 是否系统角色（可选，默认false）
}

// PermUpdateRoleDefinition - 更新角色定义
message PermUpdateRoleDefinition {
  string role_code = 1;      // 角色代码（必填）
  string role_name = 2;     // 角色名称（可选）
  string role_description = 3; // 角色描述（可选）
  int32 priority = 4;       // 优先级（可选）
}

// PermEnableRoleDefinition - 启用角色定义
message PermEnableRoleDefinition {
  string role_code = 1;      // 角色代码（必填）
}

// PermDisableRoleDefinition - 禁用角色定义
message PermDisableRoleDefinition {
  string role_code = 1;      // 角色代码（必填）
}

// ========== Role Definition 结果对象（加 Perm 前缀，首字母大写）==========

// PermRoleDefinitionList - 角色定义列表
message PermRoleDefinitionList {
  repeated RoleDefinition role_definitions = 1; // 角色定义列表
}
