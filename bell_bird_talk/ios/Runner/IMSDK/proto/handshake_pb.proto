syntax = "proto3";
package com.cloud.im.common.core.protocol.handshake;

message HandshakeInit {
  bytes clientPubA  = 1; // X25519 公钥 32B
  bytes clientNonce = 2; // 客户端随机数 16B
}

message HandshakeResp {
  bytes serverPubB  = 1; // X25519 公钥 32B
  bytes serverNonce = 2; // 服务端随机数 16B
  bool success      = 3; // 协商成功标识
  // 简化设计：移除ivSession和encryptedSessionKey
  // 客户端和服务端各自计算K_shared，直接用于消息加密
}

// 移除 EncryptedMessage - 现在使用EVP_aes_256_gcm帧格式，不需要单独的加密消息类型
// message EncryptedMessage {
//   bytes iv         = 1; // AES-GCM IV 12B
//   bytes ciphertext = 2; // 加密后的业务数据
//   bytes tag        = 3; // GCM 校验 Tag 16B
// }

// SCRAM认证相关消息
message ScramClientFirstMessage {
  string username    = 1; // 用户名
  string clientNonce = 2; // 客户端随机数
  string clientTimeZone = 3; // 客户端时区
  repeated string supportedEncryptionMethods = 4; // 客户端支持的加密方式 ["ECDH"]
}

message ScramServerFirstMessage {
  string combinedNonce = 1; // 客户端随机数+服务端随机数
  string salt          = 2; // Base64编码的盐值
  int32  iterationCount = 3; // 迭代次数
  string serverTimeZone = 4; // 服务端时区
}

message ScramClientFinalMessage {
  string channelBinding = 1; // 通道绑定
  string combinedNonce  = 2; // 客户端随机数+服务端随机数
  string clientProof    = 3; // 客户端证明
}

message ScramServerFinalMessage {
  string serverSignature = 1; // 服务端签名
  string selectedEncryptionMethod = 2; // 服务端选择的加密方式 "ECDH" | "NONE"
  bool encryptionRequired = 3; // 是否要求加密通信
}

message ScramError {
  string errorCode    = 1; // 错误代码
  string errorMessage = 2; // 错误消息
}