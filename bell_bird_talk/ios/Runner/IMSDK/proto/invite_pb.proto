syntax = "proto3";

package im.invite;

option java_package = "com.cloud.im.common.core.protocol.invite";
option java_outer_classname = "InviteProtos";

// ============ 核心领域对象 ============

// 用户邀请统计信息 - 核心领域对象
// 用于用户邀请码统计
message UserInviteStats {
  string biz_code = 1;              // 用户的业务邀请码（必填）
  string system_code = 2;           // 系统邀请码（必填）
  int32 total_invites = 3;          // 总邀请人数（必填）
  int32 successful_invites = 4;     // 成功注册人数（必填）
  int32 today_invites = 5;          // 今日邀请人数（必填）
  int32 this_month_invites = 6;     // 本月邀请人数（必填）
  int64 last_invite_time = 7;       // 最后一次邀请时间（可选）
  int64 first_invite_time = 8;      // 首次邀请时间（可选）
}

// ============ 查询操作 ============

// 验证邀请码 - 查询操作
// 用于验证邀请码有效性
message Validate {
  string biz_code = 1;      // 待验证的业务邀请码（必填）
}

// 获取用户邀请统计 - 查询操作
// 用于获取用户邀请统计信息
message GetUserStats {
  string user_id = 1;          // 用户ID（必填）
}

// ============ 操作对象 ============

// 生成用户邀请码 - 操作对象
// 用于为用户生成邀请码
message GenerateUserInviteCode {
  string user_id = 1;          // 用户ID（必填）
}

// ============ 结果对象 ============

// 用户邀请码生成结果 - 结果对象
// 用于用户邀请码生成响应
message GenerateUserResult {
  string biz_code = 1;         // 生成的业务邀请码（必填）
  string system_code = 2;      // 系统邀请码（必填）
  string user_id = 3;          // 用户ID（必填）
  int64 timestamp = 4;         // 生成时间戳（必填）
}

// ====================================
// 通用邀请码模块消息定义
// ====================================

// ============ 核心领域对象 ============

// 邀请码详细信息 - 核心领域对象
message InviteCode {
  string biz_code = 1;              // 业务邀请码（6-8位Base62）
  string system_code = 2;           // 系统邀请码（4位Base62）
  string source_type = 3;           // 来源类型
  string source_id = 4;             // 来源ID
  string source_name = 5;           // 来源名称
  string status = 6;                // 状态：ACTIVE/DISABLED/EXPIRED/EXHAUSTED
  int32 max_use_count = 7;          // 最大使用次数
  int32 current_use_count = 8;      // 当前使用次数
  int64 expire_time = 9;            // 过期时间（毫秒时间戳，0表示永不过期）
  string description = 10;           // 描述
  int64 create_time = 11;           // 创建时间（毫秒时间戳）
  int64 update_time = 12;           // 更新时间（毫秒时间戳）
  bool is_usable = 13;              // 是否可用（综合状态判断）
}

// 邀请使用记录 - 核心领域对象
message InviteUsageRecord {
  int64 id = 1;                     // 记录ID
  string biz_code = 2;              // 业务邀请码
  string system_code = 3;           // 系统邀请码
  string source_type = 4;           // 来源类型
  string source_id = 5;             // 来源ID
  string source_name = 6;           // 来源名称
  string invitee_user_id = 7;        // 被邀请者用户ID
  string invitee_username = 8;      // 被邀请者用户名
  string invitee_nickname = 9;      // 被邀请者昵称
  bool successful = 10;              // 是否成功
  string failure_reason = 11;       // 失败原因
  string client_ip = 12;            // 客户端IP
  string user_agent = 13;           // 用户代理
  int64 create_time = 14;           // 创建时间（毫秒时间戳）
}

// 邀请码统计信息 - 核心领域对象
message InviteCodeStats {
  string biz_code = 1;              // 业务邀请码
  string system_code = 2;           // 系统邀请码
  string source_type = 3;           // 来源类型
  string source_id = 4;             // 来源ID
  string source_name = 5;           // 来源名称
  int32 total_usage = 6;            // 总使用次数
  int32 successful_usage = 7;       // 成功使用次数
  int32 failed_usage = 8;           // 失败使用次数
  int32 today_usage = 9;            // 今日使用次数
  int32 this_month_usage = 10;      // 本月使用次数
  int64 last_usage_time = 11;       // 最后使用时间
  int64 first_usage_time = 12;      // 首次使用时间
  double success_rate = 13;         // 成功率（0.0-1.0）
}

// 邀请码来源类型信息 - 核心领域对象
message InviteSourceType {
  string type_code = 1;             // 类型代码
  string type_name = 2;             // 类型名称
  string description = 3;           // 描述
  int32 code_range_min = 4;         // 邀请码范围最小值
  int32 code_range_max = 5;         // 邀请码范围最大值
}

// 批量验证中的单个结果 - 核心领域对象
message BatchValidationItem {
  string biz_code = 1;              // 业务邀请码
  bool is_valid = 2;                // 是否有效
  string source_type = 3;           // 来源类型
  string reason = 4;                // 无效原因（如果无效）
}

// ============ 查询操作 ============

// 获取邀请码详细信息 - 查询操作
message GetDetail {
  string biz_code = 1;              // 业务邀请码
}

// 获取邀请使用记录 - 查询操作
message GetUsageRecords {
  string biz_code = 1;              // 业务邀请码
  int32 limit = 2;                  // 记录数量限制（默认20）
  int32 offset = 3;                 // 偏移量（用于分页）
}

// 获取来源邀请码列表 - 查询操作
message ListBySource {
  string source_type = 1;           // 来源类型
  string source_id = 2;             // 来源ID
  int32 limit = 3;                  // 数量限制（默认10）
  string status_filter = 4;         // 状态过滤（可选）
}

// 获取邀请码统计 - 查询操作
message GetStats {
  string biz_code = 1;              // 业务邀请码
}

// 批量验证邀请码 - 查询操作
message BatchValidate {
  repeated string biz_codes = 1;     // 业务邀请码列表
}

// 获取支持的邀请码来源类型 - 查询操作
message GetSupportedTypes {
  // 空请求
}

// ============ 操作对象 ============

// 创建邀请码 - 操作对象
message CreateInviteCode {
  string source_type = 1;           // 来源类型：USER/GROUP/SYSTEM/ACTIVITY/BUSINESS
  string source_id = 2;             // 来源ID
  string source_name = 3;           // 来源名称
  int32 max_use_count = 4;          // 最大使用次数（0表示无限制）
  int64 expire_time = 5;            // 过期时间（0表示永不过期）
  string description = 6;           // 描述
}

// 使用邀请码 - 操作对象
message UseInviteCode {
  string biz_code = 1;              // 业务邀请码
  string invitee_user_id = 2;        // 被邀请者用户ID
  string invitee_username = 3;      // 被邀请者用户名
  string invitee_nickname = 4;      // 被邀请者昵称
  string client_ip = 5;             // 客户端IP
  string user_agent = 6;            // 用户代理
}

// 更新邀请码状态 - 操作对象
message UpdateStatus {
  string biz_code = 1;              // 业务邀请码
  string new_status = 2;            // 新状态：ACTIVE/DISABLED/EXPIRED/EXHAUSTED
  string reason = 3;                // 更新原因
}

// ============ 结果对象 ============

// 创建邀请码结果 - 结果对象
message CreateResult {
  string biz_code = 1;              // 业务邀请码（6-8位Base62）
  string system_code = 2;           // 系统邀请码（4位Base62）
  string source_type = 3;           // 来源类型
  string source_id = 4;             // 来源ID
}

// 邀请码详细信息结果 - 结果对象
message Detail {
  InviteCode detail = 1;  // 邀请码详细信息
  bool found = 2;                   // 是否找到
}

// 验证邀请码结果 - 结果对象
message ValidateResult {
  bool is_valid = 1;                // 是否有效
  string source_type = 2;           // 来源类型（如果有效）
  string source_id = 3;             // 来源ID（如果有效）
  string source_name = 4;           // 来源名称（如果有效）
  string inviter_user_id = 5;       // 邀请者用户ID（可选）
  string inviter_username = 6;      // 邀请者用户名（可选）
  string inviter_nickname = 7;      // 邀请者昵称（可选）
  string reason = 8;                // 无效原因（如果无效）
}

// 使用邀请码结果 - 结果对象
message UseResult {
  bool successful = 1;              // 是否成功
  string source_type = 2;           // 邀请码来源类型
  string source_id = 3;             // 邀请码来源ID
  string source_name = 4;           // 邀请码来源名称
  string failure_reason = 5;        // 失败原因（如果失败）
}

// 邀请使用记录列表 - 结果对象
message UsageRecords {
  repeated InviteUsageRecord records = 1; // 使用记录列表
  int32 total_count = 2;            // 总记录数
  bool has_more = 3;                // 是否还有更多记录
}

// 邀请码列表 - 结果对象
message IList {
  repeated InviteCode invite_codes = 1; // 邀请码列表
  int32 total_count = 2;            // 总数量
}

// 更新状态结果 - 结果对象
message UpdateStatusResult {
  bool successful = 1;              // 是否成功
  string old_status = 2;            // 原状态
  string new_status = 3;            // 新状态
}

// 邀请码统计结果 - 结果对象
message Stats {
  InviteCodeStats stats = 1;    // 统计信息
  bool found = 2;                   // 是否找到
}

// 批量验证结果 - 结果对象
message BatchValidateResult {
  repeated BatchValidationItem results = 1; // 验证结果列表
}

// 支持的来源类型列表 - 结果对象
message SupportedTypes {
  repeated InviteSourceType source_types = 1; // 支持的来源类型列表
}
