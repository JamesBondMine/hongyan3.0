syntax = "proto3";
package im.translate;

import "system_pb.proto";

option java_package = "com.cloud.im.common.core.protocol.translate";
option java_outer_classname = "TranslateProtos";

// ============ 枚举类型定义 ============

// 翻译通道枚举
enum TChannel {
  YUEE = 0;              // 阅译
  LJCH = 1;              // 蓝鲸出海
  GOOGLE = 2;            // Google翻译
  CHATGPT = 3;           // ChatGPT翻译
  DEEPL = 4;             // DeepL翻译
  CUSTOM = 99;           // 自定义通道
}

// 配置级别枚举
enum ConfigLevel {
  GLOBAL = 0;            // 全局配置（默认）
  DIALOG = 1;            // 会话配置
}

// ============ 领域对象 ============

// 翻译通道信息
message TChannelInfo {
  TChannel channel = 1;    // 通道代码
  string channel_name = 2;         // 通道名称
  string channel_code = 3;         // 通道代码（字符串）
  bool enabled = 4;                // 是否启用
  string description = 5;           // 通道描述
}

// 语言信息
message Language {
  string lang_code = 1;            // 语言代码（如：zh-CN, en-US）
  string lang_name = 2;            // 语言名称（如：简体中文、English）
  string native_name = 3;          // 本地名称
}

// 用户翻译配置
message UserConfig {
  string app_id = 1;               // 应用ID
  string user_id = 2;              // 用户UID
  string dialog_id = 3;            // 会话ID（全局配置为空）
  ConfigLevel level = 4;            // 配置级别
  bool translate_switch = 5;        // 发送翻译开关
  string channel = 6;               // 发送翻译通道
  string target_lang = 7;          // 发送目标语言
  bool receive_translate_switch = 8; // 接收翻译开关
  string receive_channel = 9;       // 接收翻译通道
  string receive_target_lang = 10;  // 接收目标语言
  int64 create_time = 11;           // 创建时间（时间戳，毫秒）
  int64 update_time = 12;           // 更新时间（时间戳，毫秒）
}

// ============ 查询操作 ============
// 注意：Get 和 GetSupportedLanguages 使用 system.Param
// - getChannels: system.Param.param = current_lang（可选，空字符串表示不传）
// - getSupportedLanguages: system.Param.param = channel_code（必填）

// 翻译通道列表结果
message TChannelList {
  repeated TChannelInfo channels = 1;  // 通道列表
}

// 支持的语言列表结果
message LanguageList {
  repeated Language languages = 1;  // 语言列表
}

// 获取用户配置（增量同步）
message GetUserConfigs {
  int64 last_sync_time = 1;        // 上次同步时间（时间戳，毫秒，可选）
}

// 用户配置列表结果
message UserConfigList {
  repeated UserConfig configs = 1;  // 配置列表
  int64 sync_time = 2;              // 同步时间（时间戳，毫秒）
}

// ============ 操作对象 ============

// 翻译请求
message Translate {
  string channel_code = 1;         // 翻译通道代码（必填）
  string target_lang = 2;          // 目标语言（必填）
  string content = 3;               // 翻译内容（必填）
  string source_lang = 4;          // 源语言（可选，自动检测）
}

// 翻译结果
message Result {
  string translated_text = 1;      // 翻译后的文本
  string source_lang = 2;          // 检测到的源语言
  string target_lang = 3;          // 目标语言
  string channel_code = 4;         // 使用的通道代码
  int64 translate_time = 5;         // 翻译时间（时间戳，毫秒）
}

// 创建/更新用户翻译配置
message CreateUserConfig {
  string dialog_id = 1;            // 会话ID（全局配置为空）
  ConfigLevel level = 2;            // 配置级别（必填）
  bool translate_switch = 3;        // 发送翻译开关
  string channel = 4;               // 发送翻译通道
  string target_lang = 5;          // 发送目标语言
  bool receive_translate_switch = 6; // 接收翻译开关
  string receive_channel = 7;       // 接收翻译通道
  string receive_target_lang = 8;  // 接收目标语言
}

// ============ 响应说明 ============
// 操作响应使用 system.EmptyResponse（成功）或 system.Error（失败）
// 查询响应返回具体对象：TChannelList、LanguageList、UserConfigList、Result 等


