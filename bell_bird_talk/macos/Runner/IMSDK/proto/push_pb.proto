syntax = "proto3";
package im.push;

option java_package = "com.cloud.im.common.core.protocol.push";
option java_outer_classname = "PushProtos";

// ============ 枚举类型定义 ============

// 推送平台枚举
enum PushPlatform {
  // iOS平台
  APNS = 0;                // iOS推送平台（Apple Push Notification Service，默认值）
  
  // Android原生平台
  FCM = 1;                 // Android推送平台（Firebase Cloud Messaging）
  
  // Android厂商推送平台
  HUAWEI = 2;              // 华为推送（HMS Push）
  XIAOMI = 3;              // 小米推送（Mi Push）
  OPPO = 4;                // OPPO推送（OPush）
  VIVO = 5;                // vivo推送（vivo Push）
  MEIZU = 6;               // 魅族推送（Flyme Push）
  HONOR = 7;               // 荣耀推送（HMS Push）
  
  // 推送聚合厂商
  JPUSH = 8;               // 极光推送（JPush）
  GETUI = 9;               // 个推（Getui）
  UMENG = 10;              // 友盟推送（Umeng Push）
  BAIDU = 11;              // 百度推送（Baidu Push）
  XINGE = 12;              // 信鸽推送（Tencent Xinge Push）
}

// 推送状态枚举
enum PushStatus {
  PENDING = 0;            // 待推送（默认值）
  SUCCESS = 1;            // 推送成功
  FAILED = 2;             // 推送失败
  CANCELLED = 3;          // 已取消
}

// ============ 领域对象 ============

// 推送Token信息
message PushTokenInfo {
  string push_token = 1;           // 推送Token（各平台的Device Token或Registration Token）
  PushPlatform platform = 2;       // 推送平台
  string bundle_id = 3;            // Bundle ID（iOS应用标识，APNS必需）
  string environment = 4;           // 推送环境（production/development，iOS可选）
  string app_secret = 5;           // 应用密钥（部分厂商需要）
  string app_key = 6;              // 应用Key（部分厂商需要）
  bool sound_enabled = 7;          // 是否启用声音（默认true）
  bool badge_enabled = 8;          // 是否启用角标（默认true）
}

// 推送通知内容
message PushNotification {
  string title = 1;                 // 推送标题
  string body = 2;                 // 推送内容
  string sound = 3;                 // 声音文件名（可选，默认"default"）
  int32 badge = 4;                 // 角标数量（可选）
  map<string, string> custom_data = 5; // 自定义数据（JSON格式）
  
  // 关联信息
  string message_id = 10;          // 关联的消息ID
  string conversation_id = 11;     // 关联的会话ID
  string sender_id = 12;           // 发送者ID
  string sender_name = 13;         // 发送者名称
}

// 推送结果
message PushResult {
  PushStatus status = 1;           // 推送状态
  string error_code = 2;           // 错误码（失败时）
  string error_message = 3;        // 错误消息（失败时）
  int64 sent_at = 4;               // 推送发送时间（时间戳，毫秒）
}

// 批量推送结果
message BatchPushResult {
  int32 total_count = 1;           // 总推送数量
  int32 success_count = 2;         // 成功数量
  int32 failed_count = 3;          // 失败数量
  repeated PushResult results = 4; // 推送结果列表
}

// ============ 操作对象 ============

// 注册推送Token
message RegisterToken {
  string device_id = 1;            // 设备ID（必填）
  PushTokenInfo token_info = 2;    // 推送Token信息（必填）
}

// 更新推送Token
message UpdateToken {
  string device_id = 1;            // 设备ID（必填）
  PushTokenInfo token_info = 2;    // 推送Token信息（必填）
}

// 删除推送Token
message DeleteToken {
  string device_id = 1;            // 设备ID（必填）
}

// 发送推送通知
message SendNotification {
  string user_id = 1;              // 目标用户ID（必填）
  PushNotification notification = 2; // 推送通知内容（必填）
}

// 批量发送推送通知
message BatchSendNotification {
  repeated string user_ids = 1;    // 目标用户ID列表（必填，最多1000个）
  PushNotification notification = 2; // 推送通知内容（必填）
}

// ============ 响应说明 ============
// 操作响应使用 system.EmptyResponse（成功）或 system.Error（失败）
// 查询响应返回具体对象：PushResult、BatchPushResult 等
