syntax = "proto3";

package im.group;

option java_package = "com.cloud.im.common.core.protocol";
option java_outer_classname = "InnerProtos";


message ServiceDescriptor {
  string service_name = 1;
  string model = 2;        // BizModel 名称
  repeated Method methods = 3;

  message Method {
    string name = 1;
    string param_type = 2;
  }
}

message ServiceList {
  repeated ServiceDescriptor services = 1;
}