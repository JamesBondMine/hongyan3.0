syntax = "proto3";
package im.broadcast;

option java_package = "com.cloud.im.common.core.protocol.broadcast";
option java_outer_classname = "BroadcastProtos";

import "system_pb.proto";

// ============ 枚举类型定义 ============

// 广播消息类型枚举
enum BroadcastMessageType {
  SYSTEM = 0;                   // 系统消息（默认值）
  ANNOUNCEMENT = 1;              // 公告消息
  NOTICE = 2;                    // 通知消息
  ALERT = 3;                     // 警告消息
}

// 广播优先级枚举
enum BroadcastPriority {
  NORMAL = 0;                   // 普通优先级（默认值）
  HIGH = 1;                     // 高优先级
  URGENT = 2;                   // 紧急优先级
}

// 广播过滤类型枚举
enum BroadcastFilterType {
  ALL = 0;                      // 所有用户（默认值）
  BY_TAG = 1;                   // 按用户标签
  BY_REGION = 2;                // 按地区
  BY_VERSION = 3;               // 按应用版本
  CUSTOM = 99;                  // 自定义条件
}

// ============ 领域对象 ============

// 广播消息
message BroadcastMessage {
  string title = 1;                    // 广播标题
  string content = 2;                  // 广播内容
  BroadcastMessageType message_type = 3; // 消息类型
  BroadcastPriority priority = 4;      // 优先级
  map<string, string> custom_data = 5; // 自定义数据（JSON格式）
}

// 广播过滤条件
message BroadcastFilter {
  BroadcastFilterType filter_type = 1; // 过滤类型
  repeated string user_tags = 2;        // 用户标签列表（按标签过滤时使用）
  repeated string regions = 3;         // 地区列表（按地区过滤时使用）
  string min_version = 4;              // 最小版本（按版本过滤时使用）
  string max_version = 5;              // 最大版本（按版本过滤时使用）
  map<string, string> custom_conditions = 6; // 自定义条件（JSON格式）
}

// 广播结果
message BroadcastResult {
  int64 broadcast_id = 1;              // 广播ID
  int32 total_users = 2;               // 目标用户总数
  int32 online_users = 3;              // 在线用户数
  int32 offline_users = 4;             // 离线用户数
  int32 mqtt_sent = 5;                 // MQTT推送成功数
  int32 mqtt_failed = 6;               // MQTT推送失败数
  int32 push_sent = 7;                 // 推送通知成功数
  int32 push_failed = 8;               // 推送通知失败数
  int64 sent_at = 9;                   // 发送时间（时间戳，毫秒）
}

// 广播记录
message BroadcastRecord {
  int64 id = 1;                        // 广播ID
  string title = 2;                    // 广播标题
  string content = 3;                  // 广播内容
  BroadcastMessageType message_type = 4; // 消息类型
  BroadcastPriority priority = 5;      // 优先级
  BroadcastFilter filter = 6;          // 过滤条件
  int32 total_users = 7;               // 目标用户总数
  int32 online_users = 8;              // 在线用户数
  int32 offline_users = 9;             // 离线用户数
  int32 mqtt_sent = 10;                // MQTT推送成功数
  int32 push_sent = 11;                // 推送通知成功数
  string sender_id = 12;                // 发送者ID
  string sender_name = 13;             // 发送者名称
  int64 sent_at = 14;                  // 发送时间（时间戳，毫秒）
}

// 广播记录列表
message BroadcastRecordList {
  repeated BroadcastRecord records = 1;
  com.cloud.im.common.core.system.Page page = 2;                 // 分页信息
}

// ============ 操作对象 ============

// 发送全量广播
message SendBroadcast {
  BroadcastMessage message = 1;        // 广播消息（必填）
}

// 发送条件广播
message SendConditionalBroadcast {
  BroadcastFilter filter = 1;          // 广播过滤条件（必填）
  BroadcastMessage message = 2;         // 广播消息（必填）
}

// 查询广播历史
message GetBroadcastHistory {
  BroadcastMessageType message_type = 1; // 消息类型过滤（可选）
  int32 offset = 2;                    // 偏移量（可选，默认0）
  int32 limit = 3;                     // 限制数量（可选，默认20）
}

// ============ 响应说明 ============
// 操作响应使用 BroadcastResult（成功）或 system.Error（失败）
// 查询响应返回具体对象：BroadcastRecordList

