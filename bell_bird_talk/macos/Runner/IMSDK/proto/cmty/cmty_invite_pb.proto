syntax = "proto3";

package im.cmty.invite;

import "system_pb.proto";

option java_package = "com.cloud.im.common.core.protocol.cmty.invite";
option java_outer_classname = "CmtyInviteProtos";

// ========== 枚举类型定义 ==========

// 邀请链接状态枚举
enum CmtyInviteLinkStatus {
    VALID = 0;      // 有效（默认值）
    EXPIRED = 1;    // 已过期
}

// ========== 查询操作 ==========

// CmtyInviteMember - 邀请成员
// 注意：cmtyId 从 Topic 路径中获取，inviterUserId 从 fromId 获取
message CmtyInviteMember {
    string user_id = 1;      // 被邀请用户ID（必填）
    string message = 2;      // 邀请消息（可选）
}

// CmtyMyInviteStatsQuery - 我的邀请统计查询
// 注意：cmtyId 从 Topic 路径中获取，userId 从 fromId 获取
message CmtyMyInviteStatsQuery {
    int64 start_time = 1;    // 开始时间（可选，时间戳，用于时间维度统计）
    int64 end_time = 2;      // 结束时间（可选，时间戳，用于时间维度统计）
}

// CmtyInviteListQuery - 邀请列表查询（管理员视角）
// 注意：cmtyId 从 Topic 路径中获取
message CmtyInviteListQuery {
    com.cloud.im.common.core.system.Page page = 1;  // 分页参数（可选，使用系统类型）
    CmtyInviteLinkStatus status = 2;     // 状态过滤（可选，不填则查询所有状态，使用枚举类型）
    string creator_user_id = 3;          // 创建者用户ID过滤（可选）
    int64 start_time = 4;                // 开始时间（可选，时间戳）
    int64 end_time = 5;                  // 结束时间（可选，时间戳）
}

// CmtyInviteStatsQuery - 邀请统计查询（管理员视角）
// 注意：cmtyId 从 Topic 路径中获取
message CmtyInviteStatsQuery {
    int64 start_time = 1;    // 开始时间（可选，时间戳，用于时间维度统计）
    int64 end_time = 2;      // 结束时间（可选，时间戳，用于时间维度统计）
    bool include_user_stats = 3; // 是否包含按用户维度的统计（可选，默认true）
}

// ========== 领域对象 ==========

// CmtyInviteLink - 邀请链接
message CmtyInviteLink {
    string invite_code = 1;          // 邀请码（返回字段）
    string invite_link = 2;          // 邀请链接（返回字段）
    string creator_user_id = 3;      // 创建者用户ID（返回字段）
    int64 expire_at = 4;             // 过期时间（返回字段）
    int64 created_at = 5;             // 创建时间（返回字段，系统自动生成）
    CmtyInviteLinkStatus status = 6;     // 状态（返回字段，使用枚举类型）
    int32 used_count = 7;            // 使用次数（返回字段）
}

// CmtyMyInviteStats - 我的邀请统计
message CmtyMyInviteStats {
    string cmty_id = 1;            // 社群ID（返回字段）
    string user_id = 2;                  // 用户ID（返回字段）
    bool has_invite_link = 3;            // 是否有邀请链接（返回字段）
    CmtyInviteLinkStatus status = 4;         // 邀请码状态（返回字段，使用枚举类型）
    int64 expire_at = 5;                 // 过期时间（返回字段）
    int32 invited_member_count = 6;      // 我邀请加入的成员数量（返回字段）
    int32 total_invited_count = 7;       // 总邀请次数（返回字段，历史累计）
    int32 today_invited_count = 8;       // 今日邀请次数（返回字段）
    int32 week_invited_count = 9;        // 本周邀请次数（返回字段）
    int32 month_invited_count = 10;      // 本月邀请次数（返回字段）
}

// CmtyUserInviteStats - 用户邀请统计
message CmtyUserInviteStats {
    string user_id = 1;                 // 用户ID（返回字段）
    string nickname = 2;                // 用户昵称（返回字段）
    string avatar = 3;                  // 用户头像（返回字段）
    int32 invited_member_count = 4;     // 邀请加入的成员数量（返回字段）
    int32 total_invite_count = 5;       // 总邀请次数（返回字段）
    int64 last_invite_at = 6;            // 最后邀请时间（返回字段）
}

// ========== 结果对象 ==========

// CmtyInviteList - 邀请列表
message CmtyInviteList {
    repeated CmtyInviteLink invites = 1;     // 邀请列表（返回字段）
    com.cloud.im.common.core.system.Page page = 2;  // 分页元数据（使用系统类型）
}

// CmtyInviteStats - 邀请统计（管理员视角）
message CmtyInviteStats {
    string cmty_id = 1;        // 社群ID（返回字段）
    
    // 整体统计
    int32 total_invite_links = 2;   // 总邀请链接数（返回字段）
    int32 valid_invite_links = 3;   // 有效邀请链接数（返回字段）
    int32 expired_invite_links = 4; // 已过期邀请链接数（返回字段）
    int32 total_invited_members = 5; // 通过邀请加入的总成员数（返回字段）
    
    // 时间维度统计
    int32 today_invited_count = 6;  // 今日邀请加入的成员数（返回字段）
    int32 week_invited_count = 7;    // 本周邀请加入的成员数（返回字段）
    int32 month_invited_count = 8;   // 本月邀请加入的成员数（返回字段）
    
    // 按用户维度统计（可选）
    repeated CmtyUserInviteStats user_stats = 9; // 每个用户的邀请统计（返回字段，可选，按邀请数量排序）
}

// CmtyBatchDeleteResult - 批量删除结果
message CmtyBatchDeleteResult {
    int32 total_count = 1;        // 总数量（返回字段）
    int32 success_count = 2;      // 成功数量（返回字段）
    int32 failed_count = 3;       // 失败数量（返回字段）
    repeated string failed_codes = 4; // 失败的邀请码列表（返回字段）
}

// CmtyBatchExpireResult - 批量失效结果
message CmtyBatchExpireResult {
    int32 total_count = 1;        // 总数量（返回字段）
    int32 success_count = 2;      // 成功数量（返回字段）
    int32 failed_count = 3;       // 失败数量（返回字段）
    repeated string failed_codes = 4; // 失败的邀请码列表（返回字段）
}

// ========== 操作对象 ==========

// CmtyCreateInviteLink - 创建邀请链接
// 注意：cmtyId 从 Topic 路径中获取，creatorUserId 从 fromId 获取
message CmtyCreateInviteLink {
    int32 expire_days = 1;   // 有效期天数（可选，默认7天）
}

// CmtyBatchDeleteInviteLinks - 批量删除邀请链接
// 注意：cmtyId 从 Topic 路径中获取
message CmtyBatchDeleteInviteLinks {
    repeated string invite_codes = 1;  // 邀请码列表（必填）
    string creator_user_id = 2;       // 创建者用户ID（可选，如果指定则只删除该用户的邀请码）
}

// CmtyBatchExpireInviteLinks - 批量失效邀请链接
// 注意：cmtyId 从 Topic 路径中获取
message CmtyBatchExpireInviteLinks {
    repeated string invite_codes = 1;  // 邀请码列表（必填）
    string creator_user_id = 2;       // 创建者用户ID（可选，如果指定则只失效该用户的邀请码）
}

// CmtyInviteValidationResult - 邀请码验证结果
message CmtyInviteValidationResult {
    bool valid = 1;              // 是否有效（返回字段）
    string cmty_id = 2;     // 社群ID（返回字段）
    string invite_code = 3;       // 邀请码（返回字段）
    string creator_user_id = 4;  // 创建者用户ID（返回字段）
    int64 expire_at = 5;         // 过期时间（返回字段）
    int64 created_at = 6;        // 创建时间（返回字段）
    string reason = 7;           // 原因（如果无效，返回字段）
}

